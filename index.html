// ---------- home: headline, streak, category dashboard with per-type mastery progress and rating trends ----------
const mainRounds = hist => hist.filter(r => !r.drill);
// ---------- stats: per drill (and the main round), from the saved history ----------
const roundTotals = r => Object.values(r.cats).reduce((a, c) => ({ n: a.n + c.n, ok: a.ok + c.ok, ms: a.ms + c.ms }), { n: 0, ok: 0, ms: 0 });
const secsPerQ = t => t.ok ? t.ms / t.ok / 1000 : null;
const sumTotals = rs => rs.map(roundTotals).reduce((a, c) => ({ n: a.n + c.n, ok: a.ok + c.ok, ms: a.ms + c.ms }), { n: 0, ok: 0, ms: 0 });
const when = t => new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
function statsBlock(hist, id, name, open = false) {
  const rounds = hist.filter(r => (r.drill || null) === id && r.points !== undefined && roundTotals(r).n);
  if (!rounds.length) return '';
  const top = [...rounds].sort((a, b) => b.points - a.points || (secsPerQ(roundTotals(a)) ?? 1e9) - (secsPerQ(roundTotals(b)) ?? 1e9)).slice(0, 3);
  const t3 = secsPerQ(sumTotals(top)), all = sumTotals(rounds), fmt = x => x === null ? '–' : x.toFixed(1) + ' s';
  const rows = top.map((r, i) => { const t = roundTotals(r);
    return `<tr><td>${i + 1}. ${when(r.t)}</td><td class="n">${r.points}</td><td class="n">${t.ok}/${t.n}</td><td class="n">${fmt(secsPerQ(t))}</td></tr>`; }).join('');
  const recent = rounds.slice(-20), times = recent.map(r => secsPerQ(roundTotals(r))), tMax = Math.max(...times.filter(x => x !== null), 1);
  const timeLine = sparkline(recent.map((r, i) => ({ y: times[i] === null ? 0 : 1 - times[i] / tMax, r, s: times[i] })), v => `${when(v.r.t)}: ${fmt(v.s)} per question`, 260);
  const best = Math.max(...recent.map(r => r.points), 1);
  const ptsLine = sparkline(recent.map(r => ({ y: Math.max(r.points, 0) / best, r })), v => `${when(v.r.t)}: ${v.r.points} points`, 260);
  return `<details class="cat"${open ? ' open' : ''}><summary><span>${name}<br><span class="muted">${rounds.length} round${rounds.length === 1 ? '' : 's'} · best ${top[0].points}</span></span>
    <span class="muted">best-3 avg</span><b>${fmt(t3)}</b></summary>
    <table><tr><th>Best rounds</th><th class="n">Points</th><th class="n">Correct</th><th class="n">s / question</th></tr>${rows}</table>
    <p class="muted">All rounds: ${Math.round(100 * all.ok / all.n)}% correct, ${fmt(secsPerQ(all))} per correct answer. Best-3 average is per question, pooled over those rounds.</p>
    <div class="muted">Time per question (higher line = faster)</div>${timeLine}
    <div class="muted">Points</div>${ptsLine}</details>`;
}
function statsSection(hist) {
  const blocks = [statsBlock(hist, null, 'Main round'), ...CONFIG.drills.map(d => statsBlock(hist, d.id, d.name))].join('');
  return blocks ? `<h2>Stats · tap for best rounds and trends</h2>${blocks}` : '';
}
function drillsBlock() {

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
function showHome() {
  const hist = loadJSON(HISTORY_KEY, []), types = activeTypes(), mastered = types.filter(t => RS[t.id]?.mastered).length;
  const streak = dayStreak(hist.map(r => dayKey(r.t)));

function dashboard(types, hist) {
  return '<h2>Categories · tap for types</h2>' + [...new Set(types.map(t => t.cat))].map(cat => {
    const ts = types.filter(t => t.cat === cat), done = ts.filter(t => RS[t.id]?.mastered).length;

function typeRow(t, hist) {

<script>

  const out = { checker: checkerTests(), syntax: syntaxTests(), incentives: incentiveTests(), mastery: masteryTests(), generators: generatorTests() };

// [canonical, kind, inputs that must pass, inputs that must fail, extra options]

  ['e^(2x)', 'expr', ['%e^(2*x)', 'exp(2*x)', '(%e^x)^2', '%e^x*exp(x)'], ['e^(2*x)', '%e^(2x)', '%e^2*x'], { strict: true }],
  ['5+i', 'num', ['5+%i', '%i+5', '5+1*%i'], ['5+i', '5+2*%i', '5+i2'], { strict: true }],
  ['e^(pi*i/3)/(x^3-1)', 'expr', ['%e^(%pi*%i/3)/(x^3-1)'], ['%e^(%pi%i/3)/(x^3-1)', '%e^(%pi*%i/3)/x^3-1'], { strict: true }],

function syntaxTests() {
  const failed = [], fail = (what, input, expected, got) => got !== expected && failed.push({ what, input, expected, got });
  for (const [s, want] of SYNTAX_CASES.official) fail('isOfficial', s, want, isOfficial(s));
  for (const [s, want] of SYNTAX_CASES.sentence) fail('isSentence', s, want, isSentence(s));
  for (const [abbr, off] of SYNTAX_CASES.restore) {
    fail('official()', abbr, off, official(parseLogic(abbr)));
    fail('show()', off, abbr, show(parseLogic(off)));
  }
  for (const [s, op] of SYNTAX_CASES.main) fail('main connective', s, op, parseLogic(s).op);
  return { cases: Object.values(SYNTAX_CASES).flat().length, failed };
}

// The incentives must hold at every rating level: attempting beats skipping, guessing yes/no never pays
function incentiveTests() {
  const failed = [], fail = (what, detail) => failed.push({ what, detail }), par = 6;
  const levels = [RC.start, RC.fluent, RC.fluent + 500], table = {};
  for (const r of levels) {
    const skipD = ratingDelta(r, false, 0, par), fast = ratingDelta(r, true, 0.4 * par * 1000, par), slow = ratingDelta(r, true, 5 * par * 1000, par);
    table[r] = { fastCorrect: +fast.toFixed(1), atPar: +ratingDelta(r, true, par * 1000, par).toFixed(1), slowCorrect: +slow.toFixed(1), skip: skipD };
    if (!(slow >= 0)) fail('slow correct loses rating', { r, slow });
    if (!(slow > skipD)) fail('skip not worse than slow correct', { r, slow, skipD });
    if (fast > RC.maxGain) fail('gain above cap', { r, fast });
    for (const p of [0.05, 0.5, 0.95]) if (!(p * slow + (1 - p) * skipD > skipD)) fail('attempting does not beat skipping', { r, p });
    const guess = 0.5 * ratingDelta(r, true, 300, 4) + 0.5 * skipD;
    if (!(guess < 0)) fail('guessing yes/no gains rating', { r, guess });
  }
  if (!(ratingDelta(RC.start, true, 2500, par) > ratingDelta(RC.fluent + 300, true, 2500, par))) fail('weak type does not gain more', {});
  if (!(ratingDelta(RC.start, true, 3000, par) > ratingDelta(RC.start, true, 8000, par))) fail('fast does not beat slow', {});
  const sim = (p, ms) => {
    let pts = 0, streak = 0;
    for (let i = 0; i < 20000; i++) {
      const ok = Math.random() < p;
      streak = ok ? streak + 1 : 0;
      pts += points(ok, ms, 6, { combo: comboMult(streak, 0.15), weak: 1 + CONFIG.weakness.pointsBonus, golden: false });
    }
    return +(pts / 20000).toFixed(2);
  };
  const spam = sim(0.5, 300), careful = sim(0.95, 6000);
  if (!(spam < 0)) fail('guess-spamming yes/no earns points', { spam });
  if (!(careful > spam)) fail('careful play does not beat spam', { careful, spam });
  return { failed, ratingDeltas: table, pointsPerQuestion: { spam, careful } };
}
function summaryTest() {
  const log = [{ cat: 'calc', type: 'calc-inverse', ok: false, ms: 9400, q: '$f(x) = 3x - 2$. $\\ f^{-1}(x) = ?$', ans: '(x+2)/3', delta: -30, attempt: '3x+2', skipped: true },
    { cat: 'logic', type: 'logic-valid', ok: false, ms: 2100, q: '<span class="f">P → Q, &nbsp;Q &nbsp;∴&nbsp; P</span>', ans: T`\text{Invalid}`, delta: -30, attempt: 'Valid', skipped: false },
    { cat: 'la', type: 'la-product', ok: true, ms: 26000, q: 'M', ans: 'x', delta: 3, attempt: '1,2;3,4', skipped: false },
    { cat: 'la', type: 'la-dot', ok: true, ms: 3000, q: 'D', ans: '5', delta: 20, attempt: '5', skipped: false },

  const text = roundSummary({ t: Date.now(), points: 10, score: 2, log, cats: summarise(log.filter(e => !e.unanswered)), catR: { calc: 990, logic: 990, la: 1003 }, headline: 995,
    before: { calc: 1000, logic: 1000, la: 1000 }, beforeHead: 1000 });
  const need = ['-3 < x \\le 2\\}| > 0', 'I had typed: "3x+2"', 'Correct: (x+2)/3', 'MISSED, I answered: Valid', 'P → Q, Q ∴ P', 'correct but SLOW (26.0 s, par 18 s); I answered: 1,2;3,4',
    '4. [Linear algebra · Dot product] Q: D', 'correct (3.0 s, par 7 s)', 'UNANSWERED when the round ended (12.0 s); I had typed: "1-2"', 'ALL QUESTIONS (6, in order)', 'walk me through'];
  return need.filter(n => !text.includes(n)).map(n => ({ what: 'summary missing', n }));
}
// A round that runs out of time must reach the results screen (regression: endRound <-> tick recursion)
function roundEndTest() {
  const keys = [RATINGS_KEY, PB_KEY, HISTORY_KEY], saved = keys.map(k => localStorage.getItem(k)), savedRS = RS;
  try {
    startRound();
    S.end = Date.now() - 1;
    tick();
    return S === null && $('results').classList.contains('on') ? [] : [{ what: 'round did not end at 0 s' }];
  } catch (e) {
    return [{ what: 'round end threw', error: String(e) }];
  } finally {
    if (S) clearInterval(S.timer);
    S = null;
    keys.forEach((k, i) => saved[i] === null ? localStorage.removeItem(k) : localStorage.setItem(k, saved[i]));
    RS = savedRS;
    showScreen('home');
  }
}

  const mk = (pts, ok, n, ms, drill) => ({ t: Date.now(), points: pts, drill, cats: { la: { n, ok, ms } } });
  const hist = [mk(249, 12, 12, 120100, 'matmul'), mk(118, 7, 8, 94100, 'matmul'), mk(7, 1, 2, 20200, 'matmul'), mk(7, 1, 2, 45700, 'matmul'), mk(50, 3, 3, 9000)];
  const html = statsBlock(hist, 'matmul', 'Matrix multiplication');
  const want = ['4 rounds', 'best 249', '11.7 s'];   // best-3 pooled: (120.1 + 94.1 + 20.2) s / 20 correct

  if (statsBlock(hist, null, 'Main').includes('249')) fails.push({ what: 'main stats include drill rounds' });

}
function masteryTests() {
  const failed = [...roundEndTest(), ...summaryTest(), ...statsTest()], log = (n, ok, ms, days) => Array.from({ length: n }, (_, i) => ({ d: `2026-10-${10 + i % days}`, ok: ok(i), ms }));
  const cases = [['all criteria met', log(30, () => true, 4000, 3), true], ['one day only', log(30, () => true, 4000, 1), false],
    ['median over par', log(30, () => true, 7000, 3), false], ['two misses in 30', log(30, i => i > 1, 4000, 3), false],

  const streaks = [[['2026-10-20', '2026-10-19', '2026-10-18'], '2026-10-20', 3], [['2026-10-19', '2026-10-18'], '2026-10-20', 2],
    [['2026-10-21', '2026-10-19', '2026-10-18'], '2026-10-21', 3], [['2026-10-23', '2026-10-20', '2026-10-19'], '2026-10-23', 1],
    [['2026-10-26', '2026-10-24', '2026-10-23'], '2026-10-26', 3], [[], '2026-10-20', 0]];
  for (const [days, today, want] of streaks) { const got = dayStreak(days, today); if (got !== want) failed.push({ what: 'streak', days, today, want, got }); }
  for (const [, rows] of STACK_GUIDE) for (const [stack, tex, , canon] of rows) {
    try { katex.renderToString(tex, { throwOnError: true }); } catch (e) { failed.push({ what: 'STACK guide TeX', tex }); }
    if (canon && !check({ a: canon, kind: 'expr', dom: [0.2, 0.9] }, stack, true)) failed.push({ what: 'STACK guide example rejected', stack, canon });
  }
  for (const d of CONFIG.drills) {
    d.types.filter(id => !TYPE_BY_ID[id]).forEach(id => failed.push({ what: 'drill lists unknown type', drill: d.id, id }));
    if (!d.types.some(id => TYPE_BY_ID[id])) failed.push({ what: 'drill has no types', drill: d.id });
  }
  activeTypes().filter(t => t.hub === false).forEach(t => failed.push({ what: 'drill-only type in main round', id: t.id }));
  TYPES.filter(t => !t.name || !(t.par > 0)).forEach(t => failed.push({ what: 'type lacks name/par', id: t.id }));
  return { failed };
}

function checkerTests() {
  const failed = [];
  let passed = 0;
  const run = (q, inputs, want) => inputs.forEach(s => {
    const got = check({ ...q }, s, !!q.strict);
    if (got === want) passed++; else failed.push({ canonical: q.a, kind: q.kind, input: s, expected: want, got });
  });
  for (const [a, kind, yes, no, opt] of CHECKER_CASES) { run({ a, kind, ...opt }, yes, true); run({ a, kind, ...opt }, no, false); }
  for (const [q, yes, no] of GRID_CASES) { run(q, yes, true); run(q, no, false); }
  return { passed, failed };
}

const answerInput = q => q.kind === 'vec' ? q.a.join(',') : q.kind === 'mat' ? q.a.map(r => r.join(',')).join(';') : [].concat(q.a)[0];
function generatorTests() {
  return TYPES.map(t => {
    const errors = [], seen = new Set();
    let bools = 0, made = 0, nulls = 0;
    for (let i = 0; i < 300 && errors.length < 3; i++) {
      let q;
      try { q = t.gen(); } catch (e) { errors.push('throws: ' + e.message); continue; }
      if (!q) { nulls++; continue; }
      made++;
      seen.add(q.q);
      errors.push(...validateQuestion(q));
      if (q.kind === 'bool') bools += q.a ? 1 : 0;
    }
    if (made < 30) errors.push(`only ${made}/300 draws accepted`);
    const res = { id: t.id, week: t.week, distinct: seen.size, errors };
    if (made && TYPES.length && bools) res.trueRatio = +(bools / made).toFixed(2);
    return res;
  });
}
function validateQuestion(q) {
  const errs = [];
  try { katex.renderToString(q.q.split('$').filter((_, i) => i % 2).join(' '), { throwOnError: true }); }
  catch (e) { errs.push(`KaTeX: ${e.message} in ${q.q}`); }
  if (q.show !== undefined) {
    try { katex.renderToString(q.show, { throwOnError: true }); } catch (e) { errs.push(`KaTeX show: ${q.show}`); }
  }
  const tex = q.q.split('$').filter((_, i) => i % 2).join(' ') + ' ' + answerTeX(q);
  const ugly = tex.match(/inftyty|\+\s*-\s*\d|x\^\{?1\}?(?![\d}])|x\^\{?0\}?(?![\d}])|\(\(sqrt|\*/);
  if (ugly) errs.push(`ugly TeX "${ugly[0]}" in ${q.q} / ${answerTeX(q)}`);
  if (q.kind === 'bool') { if (typeof q.a !== 'boolean' || q.labels?.length !== 2) errs.push('bad bool ' + q.q); return errs; }
  if (!check({ ...q }, answerInput(q), false)) errs.push(`own answer rejected: ${JSON.stringify(q.a)} for ${q.q}`);
  if (q.val !== undefined) {
    const v = evalAt(compileExpr(q.a), {});
    if (!v || !near(v, { re: q.val, im: 0 }, 1e-6)) errs.push(`value mismatch: ${q.a} vs ${q.val} for ${q.q}`);
  }
  if (q.check === false) errs.push('internal check failed ' + q.q);
  return errs;
}
