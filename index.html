<!-- ============================== CONFIG ==============================
  Weekly edit:
    - Retire a pool: set its weight to 0.
    - Reweight: change a category weight or a type weight.
    - Unlock future pools: raise that course's entry in currentWeek. Types with week > it stay off.
    - Add a pool: copy a type line, give it a new id, name and par, edit gen(). It enters at rating.start.
    - par = seconds a fast, fluent person needs, typing included. Fixed; it never adapts to you.
    - Tune the rating, mastery and scoring constants below.
  gen() returns null to reject a degenerate draw (the engine redraws), or:
    { q: 'prompt, TeX between $…$', a: canonical answer, kind, ...options }
  kinds: num | expr (checked by evaluation) · vec | mat (a = numbers) ·
         interval · text (a = string or list) · logic (formula, checked by truth table) ·
         bool (a = true/false, labels = [trueLabel, falseLabel]) · set (finite set, order-free, a = '{1,2,3}') ·
         syntax (exact L1 string; ASCII -> & v ~ accepted)
  type flag hub: false = drill-only (see drills).
  options: upToConstant (expr: accept any answer differing by a constant, for antiderivatives), pattern (RegExp the typed answer must match, e.g. 'one logarithm'), show (TeX for the answer), mode (keyboard: text | decimal | none), dom [lo,hi] for real variables,
           parallel (vec: any nonzero multiple), unordered (vec as a set), keys (symbol row)
======================================================================= -->
<script>
const CONFIG = {
  roundSeconds: 120,
  currentWeek: { la: 4, calc: 4, seq: 4, logic: 4, basics: 4 },   // per course: courses move at different speeds
  categories: {
    la:    { label: 'Linear algebra',       weight: 1 },
    calc:  { label: 'Calculus',             weight: 1.2 },
    seq:   { label: 'Sequences & series',   weight: 1 },
    logic: { label: 'Elementary logic',     weight: 1 },
    basics: { label: 'Basics',              weight: 1 },   // drill-only skills, never in the main round
  },
  // Focus drills: 120 s rounds on a few types, always available (ahead of lectures too). Own best score and history; ratings and mastery are shared.
  // Types marked hub: false appear only here (not in the main round, not in the overall rating).
  drills: [
    { id: 'matmul',      name: 'Matrix multiplication', types: ['la-rowcol', 'la-entry', 'la-product', 'la-product23', 'la-Av', 'la-size'] },
    { id: 'rowred',      name: 'Row reduction',         types: ['la-rowop', 'la-elimk', 'la-elementary', 'la-soltype'] },
    { id: 'subspaces',   name: 'Subspaces & span',      types: ['la-subspace', 'la-inspan', 'la-indep', 'la-basis'] },
    { id: 'dimension',   name: 'Pivots & dimension',    types: ['la-freevars', 'la-soltype', 'la-dimnamed', 'la-dimcond', 'la-dimmat'] },
    { id: 'signed',      name: 'Signed arithmetic',     types: ['arith-signed', 'arith-vecsub'] },
    { id: 'logs',        name: 'Logs & exponents',      types: ['calc-log', 'calc-ln', 'calc-loglaw', 'calc-exp', 'calc-logcombine', 'calc-expsolve', 'calc-explaw'] },
    { id: 'trig',        name: 'Exact trig',            types: ['calc-trig', 'calc-arc', 'calc-arc-branch'] },
    { id: 'complex',     name: 'Complex numbers',       types: ['calc-cx-mul', 'calc-cx-mod', 'calc-cx-arg', 'calc-cx-div', 'calc-ipow', 'calc-cx-euler'] },
    { id: 'limits',      name: 'Limits',                types: ['calc-lim-std', 'calc-lim-inf', 'calc-lim-cancel', 'calc-onesided', 'calc-liminfty', 'calc-xalpha'] },
    { id: 'continuity',  name: 'Continuity & IVT',      types: ['calc-contcheck', 'calc-onesided', 'calc-piecewise', 'calc-ivt'] },
    { id: 'diff',        name: 'Differentiation',       types: ['calc-dstd', 'calc-dchain', 'calc-dprod', 'calc-deriv'] },
    { id: 'counting',    name: 'Counting integers',     types: ['seq-terms', 'seq-const', 'seq-count'] },
    { id: 'bounds',      name: 'Inequalities',          types: ['seq-modulus', 'seq-modeq', 'seq-interval', 'seq-findN'] },
    { id: 'boundedsets', name: 'Bounded sets',          types: ['seq-bounded', 'seq-isbound', 'seq-boundset', 'seq-maxmin', 'seq-supinf'] },
    { id: 'negation',    name: 'Negating statements',   types: ['seq-negation', 'logic-negin'] },
    { id: 'syntax',      name: 'Syntax',                types: ['logic-main', 'logic-restore', 'logic-drop', 'logic-official', 'logic-sentence'] },
    { id: 'tables',      name: 'Truth tables',          types: ['logic-connective', 'logic-forced', 'logic-value', 'logic-column', 'logic-counter'] },
    { id: 'forms',       name: 'Famous forms',          types: ['logic-famous', 'logic-name'] },
    { id: 'natded',      name: 'Natural deduction',     types: ['logic-ndrule', 'logic-goalrule', 'logic-ndassume', 'logic-ndrule2', 'logic-quantlegal', 'logic-eqelim'] },
    { id: 'predsyntax',  name: 'Predicate syntax',      types: ['logic-freebound', 'logic-freevars', 'logic-l2sentence', 'logic-subst'] },
    { id: 'structures',  name: 'Structures',            types: ['logic-l2true', 'logic-quantneg', 'logic-mindomain'] },
    { id: 'formal2',     name: 'Formalising L2',        types: ['logic-l2formal', 'logic-quantneg'] },
    { id: 'setsrel',     name: 'Sets & relations',      types: ['logic-setop', 'logic-setmember', 'logic-setcard', 'logic-relprop'] },
    { id: 'limits2',     name: 'Limits II',             types: ['calc-growth', 'calc-limtrick', 'calc-squeeze', 'calc-bigo', 'calc-lhopform', 'calc-lhop'] },
    { id: 'diff2',       name: 'Differentiation II',    types: ['calc-dstd', 'calc-dstd2', 'calc-dchain', 'calc-chain2', 'calc-dprod', 'calc-quot', 'calc-logdiff', 'calc-dval'] },
    { id: 'implicit',    name: 'Implicit & parametric', types: ['calc-invder', 'calc-implicit', 'calc-param', 'calc-stat', 'calc-maxmin'] },
    { id: 'integration', name: 'Integration',           types: ['calc-ftc', 'calc-anti', 'calc-defint', 'calc-subst', 'calc-csq', 'calc-parts', 'calc-pf', 'calc-improper'] },
    { id: 'taylor',      name: 'Series & Taylor',       types: ['calc-ratio', 'calc-radius', 'calc-series', 'calc-taylor', 'calc-taylora'] },
    { id: 'seqlim',      name: 'Sequence limits',       types: ['seq-convdiv', 'seq-ratlim', 'seq-growth', 'seq-rootlim', 'seq-elim', 'seq-boundlim'] },
    { id: 'epsn0',       name: 'ε–n₀ and sandwich',     types: ['seq-epsdist', 'seq-n0', 'seq-findN', 'seq-sandbound', 'seq-boundlim'] },
    { id: 'seqprops',    name: 'Bounded, monotone, subsequences', types: ['seq-bddseq', 'seq-mono', 'seq-subseq', 'seq-limpts'] },
    { id: 'series',      name: 'Series',                types: ['seq-geoseries', 'seq-termtest', 'seq-pseries', 'seq-alt', 'seq-elim'] },
    { id: 'detinv',      name: 'Determinants & inverses', types: ['la-det2', 'la-cof3', 'la-det3', 'la-detrowops', 'la-detrules', 'la-inv2', 'la-invcof'] },
    { id: 'linmaps',     name: 'Linear maps',             types: ['la-linmap', 'la-matT', 'la-matpoly', 'la-Av'] },
    { id: 'ranknull',    name: 'Rank & nullity',          types: ['la-ranknull', 'la-exists', 'la-rankinsp', 'la-kernel', 'la-freevars'] },
    { id: 'cob',         name: 'Change of basis',         types: ['la-coords', 'la-transition', 'la-inv2'] },
    { id: 'eigen',       name: 'Eigen',                   types: ['la-eig2', 'la-eigvec', 'la-charpoly', 'la-diag2'] },
    { id: 'laexam',      name: 'LA exam section A',       types: ['la-dotexp', 'la-linept', 'la-consist', 'la-depc', 'la-dimmat', 'la-linmap', 'la-invcof', 'la-detrowops', 'la-ranknull', 'la-matpoly'] },
  ],
  rating: {
    start: 1000,     // every new type enters here
    fluent: 1500,    // rating at which a performance score of 0.5 is expected
    speedWeight: 0.65,  // share of an answer's score that comes from speed vs par; the rest is for being correct.
                        // Lower = par matters less. At 0.65: always-slow-but-right settles ~1390, at par ~1630, very fast ~2100
    K: 48,           // step size: high, so each round moves the numbers
    maxGain: 24,     // cap per answer
    missLoss: 30,    // skip or wrong tap: the worst outcome. Keep above maxGain so guessing never pays
    slowFloor: 3,    // a correct answer gains at least slowFloor × (1 − expected): a little when weak, ~0 when strong
  },
  mastery: { window: 30, accuracy: 0.95, days: 3, maintenanceWeight: 0.15 },  // last 30 answers, 95%+, median < par, 3+ days
  weakness: { pull: 1, pointsBonus: 0.5 },   // weakest types drawn up to (1 + pull)×; weakest category scores up to (1 + bonus)×
  decay: { afterDays: 21, perDay: 2, maxLoss: 40 },
  skipUnlockSeconds: 5,
  resurfaceAfter: [3, 6],                    // a skipped question returns after this many other questions
  combo: { step: 0.1, max: 20 },             // points multiplier 1 + step × (streak − 1), capped at max
  points: { base: 10, miss: 25 },            // correct: base × (0.5 + speed) × combo × weakness. Skip/wrong tap: −miss × weakness
  golden: { rate: 0.03, mult: 3 },           // rare typed questions worth 3× points (never yes/no, so guessing them can't pay)
  stackOnLaptop: true,                       // on a mouse/trackpad device, typed math must use STACK syntax
  sound: true,
  modifiers: [                               // one per day, in rotation
    { name: 'Standard' },
    { name: 'Golden rush', golden: 0.12 },
    { name: 'Weakest focus', weakestBoost: 2 },
    { name: 'Combo day', comboStep: 0.15 },
  ],
};

const TYPES = [
  // ---------- Linear algebra ----------
  { id: 'la-dot', name: 'Dot product', par: 7, cat: 'la', week: 1, weight: 1, gen() {
    const n = pick([2, 3]), u = vec(n, -5, 5), v = vec(n, -5, 5);
    if (isZero(u) || isZero(v)) return null;
    return { q: T`$${colv(u)}\cdot${colv(v)}$`, a: String(dot(u, v)), kind: 'num' };
  }},
  { id: 'la-normsq', name: 'Norm squared', par: 7, cat: 'la', week: 1, weight: 1, gen() {
    const v = vec(3, -6, 6);
    if (isZero(v)) return null;
    return { q: T`$\lVert ${colv(v)} \rVert^2$`, a: String(dot(v, v)), kind: 'num' };
  }},
  { id: 'la-norm', name: 'Norm', par: 6, cat: 'la', week: 1, weight: 1, gen() {
    const [v, len] = pythagorean();
    return { q: T`$\lVert ${colv(v)} \rVert$`, a: String(len), kind: 'num', val: Math.hypot(...v) };
  }},
  { id: 'la-lincomb', name: 'Linear combination', par: 14, cat: 'la', week: 1, weight: 1, gen() {
    const a = nz(-4, 4), b = nz(-4, 4), u = vec(3, -5, 5), v = vec(3, -5, 5);
    const w = u.map((x, i) => a * x + b * v[i]);
    return { q: T`$${poly([[a, T`\mathbf u`], [b, T`\mathbf v`]])}$, $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)}$`,
             a: w, kind: 'vec', show: colv(w) };
  }},
  { id: 'la-distsq', name: 'Distance squared', par: 10, cat: 'la', week: 1, weight: 1, gen() {
    const n = pick([2, 3]), u = vec(n, -5, 5), v = vec(n, -5, 5);
    const d = u.map((x, i) => x - v[i]);
    if (isZero(d)) return null;
    return { q: T`$\lVert \mathbf u - \mathbf v \rVert^2$, $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)}$`, a: String(dot(d, d)), kind: 'num' };
  }},
  { id: 'la-orth', name: 'Orthogonal?', par: 6, cat: 'la', week: 1, weight: 1, gen() {
    const u = vec(3, -4, 4), w = vec(3, -2, 2);
    const v = Math.random() < 0.5 ? cross(u, w) : vec(3, -5, 5);
    if (isZero(u) || isZero(v) || v.some(x => Math.abs(x) > 9)) return null;
    return { q: T`Orthogonal? $\ ${colv(u)},\ ${colv(v)}$`, a: dot(u, v) === 0, kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'la-alpha', name: 'α for orthogonality', par: 18, cat: 'la', week: 1, weight: 1, gen() {
    const alpha = nz(-3, 3), v = vec(3, -3, 3), w = vec(3, -3, 3), u = vec(3, -4, 4);
    const i = w.findIndex(x => Math.abs(x) === 1);
    if (i < 0 || dot(v, w) === 0) return null;
    u[i] = 0;
    u[i] = (-alpha * dot(v, w) - dot(u, w)) / w[i];
    if (Math.abs(u[i]) > 9) return null;
    return { q: T`$\alpha$ with $(\mathbf u + \alpha\mathbf v)\perp\mathbf w$: $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)},\ \mathbf w = ${colv(w)}$`,
             a: String(alpha), kind: 'num' };
  }},
  { id: 'la-direction', name: 'Line direction', par: 9, cat: 'la', week: 1, weight: 1, gen() {
    const p = vec(3, -5, 5), r = vec(3, -5, 5), d = r.map((x, i) => x - p[i]);
    if (isZero(d)) return null;
    return { q: T`A direction vector of the line through $${colv(p)}$ and $${colv(r)}$`,
             a: d, kind: 'vec', parallel: true, show: colv(d) };
  }},
  { id: 'la-plane-d', name: 'Plane constant d', par: 8, cat: 'la', week: 1, weight: 1, gen() {
    const n = vec(3, -4, 4), p = vec(3, -4, 4);
    if (n.filter(x => x === 0).length > 1) return null;
    return { q: T`Plane through $${colv(p)}$ with normal $${colv(n)}$: $\ ${poly([[n[0], 'x'], [n[1], 'y'], [n[2], 'z']])} = d$. $\ d = ?$`,
             a: String(dot(n, p)), kind: 'num' };
  }},
  { id: 'la-size', name: 'Product size', par: 5, cat: 'la', week: 2, weight: 1, gen() {
    const { A, B, tex, X, Y } = balanced(() => {
      const A = [ri(1, 4), ri(1, 4)], B = [ri(1, 4), ri(1, 4)];
      const [tex, X, Y] = pick([['AB', A, B], ['BA', B, A], ['A^TB', tr(A), B], ['AB^T', A, tr(B)], ['B^TA^T', tr(B), tr(A)]]);
      return { A, B, tex, X, Y };
    }, d => d.X[1] === d.Y[0]);
    const ok = X[1] === Y[0];
    return { q: T`$A$ is $${A[0]}\times${A[1]}$, $B$ is $${B[0]}\times${B[1]}$. Size of $${tex}$?`,
             a: ok ? `${X[0]}x${Y[1]}` : 'undefined', kind: 'text', keys: ['×', 'undefined'], hint: 'a size like 2x3, or undefined' };
  }},
  { id: 'la-entry', name: 'Product entry', par: 7, cat: 'la', week: 2, weight: 1, gen() {
    const m = pick([2, 3]), A = mat(2, m, -3, 3), B = mat(m, 2, -3, 3), i = ri(1, 2), j = ri(1, 2);
    const v = A[i - 1].reduce((s, x, k) => s + x * B[k][j - 1], 0);
    return { q: T`$(AB)_{${i}${j}}$, $\ A = ${matTeX(A)},\ B = ${matTeX(B)}$`, a: String(v), kind: 'num',
             hint: `one number: row ${i} of A · column ${j} of B` };
  }},
  { id: 'la-Av', name: 'Matrix × vector', par: 12, cat: 'la', week: 2, weight: 1, gen() {
    const n = pick([2, 3]), A = mat(2, n, -3, 3), v = vec(n, -3, 3);
    if (isZero(v) || A.some(isZero)) return null;
    const w = A.map(r => dot(r, v));
    return { q: T`$${matTeX(A)}${colv(v)}$`, a: w, kind: 'vec', show: colv(w) };
  }},
  { id: 'la-product', name: '2×2 product', par: 18, cat: 'la', week: 2, weight: 1, gen() {
    const A = mat(2, 2, -3, 3), B = mat(2, 2, -3, 3);
    const C = A.map(r => [0, 1].map(j => r[0] * B[0][j] + r[1] * B[1][j]));
    return { q: T`$${matTeX(A)}${matTeX(B)}$`, a: C, kind: 'mat', show: matTeX(C) };
  }},
  { id: 'la-rowop', name: 'Row operation', par: 11, cat: 'la', week: 2, weight: 1, gen() {
    const r1 = [1, ri(-4, 4), ri(-5, 5)], r2 = vec(3, -5, 5), c = nz(-3, 3);
    const out = r2.map((x, k) => x - c * r1[k]);
    return { q: T`$${matTeX([r1, r2])}$, $\ R_2 \to ${poly([[1, 'R_2'], [-c, 'R_1']])}$. New $R_2$?`,
             a: out, kind: 'vec', show: matTeX([out]) };
  }},
  { id: 'la-rowcol', name: 'Row × column', par: 4, cat: 'la', week: 2, weight: 1, hub: false, gen() {
    const n = pick([2, 3]), r = vec(n, -5, 5), c = vec(n, -5, 5);
    if (isZero(r) || isZero(c)) return null;
    return { q: T`$${matTeX([r])}${colv(c)}$`, a: String(dot(r, c)), kind: 'num' };
  }},
  { id: 'la-product23', name: '2×3 · 3×2 product', par: 30, cat: 'la', week: 2, weight: 1, hub: false, gen() {
    const A = mat(2, 3, -3, 3), B = mat(3, 2, -3, 3);
    if (A.some(isZero) || [0, 1].some(j => B.every(r => r[j] === 0))) return null;
    const C = A.map(r => [0, 1].map(j => r.reduce((s, x, k) => s + x * B[k][j], 0)));
    return { q: T`$${matTeX(A)}${matTeX(B)}$`, a: C, kind: 'mat', show: matTeX(C) };
  }},
  { id: 'la-elimk', name: 'Elimination multiplier', par: 5, cat: 'la', week: 2, weight: 1, gen() {
    const p = pick([1, 2, 3, -1, -2]), e = nz(-9, 9), r1 = [p, ri(-4, 4), ri(-5, 5)], r2 = [e, ri(-5, 5), ri(-5, 5)], k = frac(e, p);
    return { q: T`$${matTeX([r1, r2])}$: $\ R_2 \to R_2 - kR_1$ makes the $(2,1)$ entry $0$. $\ k = ?$`, a: k.s, show: k.tex, kind: 'num' };
  }},
  { id: 'la-soltype', name: 'Solutions from echelon form', par: 6, cat: 'la', week: 3, weight: 1, gen() {
    const kind = pick(['unique', 'none', 'infinite']), r1 = [nz(-3, 3), ri(-3, 3), ri(-3, 3), ri(-5, 5)];
    const r2 = [0, nz(-3, 3), ri(-3, 3), ri(-5, 5)], r3 = { unique: [0, 0, nz(-3, 3), ri(-5, 5)], none: [0, 0, 0, nz(-5, 5)], infinite: [0, 0, 0, 0] }[kind];
    const rows = [r1, Math.random() < 0.3 && kind === 'infinite' ? [0, 0, nz(-3, 3), ri(-5, 5)] : r2, r3];
    const tex = T`\left(\begin{array}{ccc|c}${rows.map(r => r.join('&')).join('\\\\')}\end{array}\right)`;
    const alias = { unique: ['unique', 'one', '1', 'exactly one'], none: ['none', 'no solution', 'no solutions', '0'], infinite: ['infinite', 'infinitely many', 'inf', 'infinity', '∞'] };
    return { q: T`Augmented matrix in echelon form (unknowns $x_1, x_2, x_3$): $${tex}$. Solutions?`, a: alias[kind], show: T`\text{${kind}}`,
             kind: 'text', keys: ['none', 'unique', 'infinite'], hint: 'none, unique or infinite' };
  }},
  { id: 'la-subspace', name: 'Subspace?', par: 6, cat: 'la', week: 4, weight: 1, gen() {
    const q = balanced(() => pick(SUBSPACE_FAMILIES)(), x => x.a);
    return q && { ...q, kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'la-inspan', name: 'In the span?', par: 12, cat: 'la', week: 4, weight: 1, gen() {
    const u = vec(3, -3, 3), v = vec(3, -3, 3), n = cross(u, v), yes = Math.random() < 0.5, a = nz(-2, 2), b = nz(-2, 2);
    if (isZero(n)) return null;
    const w = u.map((x, i) => a * x + b * v[i]);
    if (!yes) w[n.findIndex(x => x !== 0)] += pick([1, -1]);   // off the plane: w·n ≠ 0
    if (w.some(x => Math.abs(x) > 12)) return null;
    return { q: T`Is $${colv(w)}$ in $\operatorname{span}\left\{${colv(u)}, ${colv(v)}\right\}$?`, a: yes, kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'la-elementary', name: 'Elementary matrix', par: 8, cat: 'la', week: 3, weight: 1, gen() {
    const E = [[1, 0, 0], [0, 1, 0], [0, 0, 1]], [i, j] = shuffle([0, 1, 2]).slice(0, 2), al = nz(-5, 5), kind = pick(['swap', 'scale', 'add']);
    let op;
    if (kind === 'swap') { [E[i], E[j]] = [E[j], E[i]]; op = T`R_${i + 1} \leftrightarrow R_${j + 1}`; }
    else if (kind === 'scale') { if (al === 1) return null; E[i][i] = al; op = T`R_${i + 1} \to ${poly([[al, `R_${i + 1}`]])}`; }
    else { E[i][j] = al; op = T`R_${i + 1} \to ${poly([[1, `R_${i + 1}`], [al, `R_${j + 1}`]])}`; }
    return { q: T`The $3\times3$ elementary matrix for $${op}$`, a: E, kind: 'mat', show: matTeX(E) };
  }},
  { id: 'la-freevars', name: 'Free variables', par: 6, cat: 'la', week: 3, weight: 1, gen() {
    const n = ri(3, 5), piv = shuffle(Array.from({ length: n }, (_, c) => c)).slice(0, ri(1, 3)).sort((a, b) => a - b);
    const M = [0, 1, 2].map(r => Array.from({ length: n }, (_, c) => r >= piv.length || c < piv[r] ? 0 : c === piv[r] ? nz(-3, 3) : ri(-3, 3)));
    return { q: T`$A = ${matTeX(M)}$ is in echelon form. Number of free variables in $A\mathbf x = \mathbf 0$?`, a: String(n - piv.length), kind: 'num' };
  }},
  { id: 'la-dimnamed', name: 'Dimension of a named space', par: 4, cat: 'la', week: 5, weight: 1, gen() {
    const n = ri(1, 6), m = ri(2, 4);
    const [tex, d] = pick([[T`\mathbb R^{${n}}`, n], [T`P_{${n}}(\mathbb R)`, n + 1], [T`M_{${m},${n}}(\mathbb R)`, m * n], [T`\mathbb C^{${n}} \text{ over } \mathbb C`, n]]);
    return { q: T`$\dim ${tex}$`, a: String(d), kind: 'num' };
  }},
  { id: 'la-dimcond', name: 'Dimension from conditions', par: 7, cat: 'la', week: 5, weight: 1, gen() {
    const n = ri(3, 5), k = ri(1, 2), [p, q, r] = shuffle(Array.from({ length: n }, (_, i) => i + 1));
    const first = pick([T`x_${p} = 0`, T`x_${p} = ${poly([[nz(-3, 3), `x_${q}`]])}`, T`x_${p} + x_${q} = 0`]);

  { id: 'calc-ipow', name: 'Powers of i', par: 4, cat: 'calc', week: 2, weight: 1, gen() {

  { id: 'calc-dchain', name: 'Chain rule (simple)', par: 8, cat: 'calc', week: 6, weight: 1, gen() {
    const a = nz(-5, 5), b = ri(1, 6), n = ri(2, 5), A = Math.abs(a), lin = poly([[A, 'x'], [b, '']]);
    const [tex, ans, sh, dom] = pick([
      [`e^{${poly([[a, 'x']])}}`, `${a}*e^(${a}x)`, T`${a}e^{${poly([[a, 'x']])}}`],
      [T`\sin(${poly([[a, 'x']])})`, `${a}*cos(${a}x)`, T`${a}\cos(${poly([[a, 'x']])})`],
      [T`(${lin})^{${n}}`, `${n * A}*(${A}x+${b})^${n - 1}`, T`${n * A}(${lin})` + (n - 1 > 1 ? `^{${n - 1}}` : '')],
      [T`\ln(${lin})`, `${A}/(${A}x+${b})`, T`\frac{${A}}{${lin}}`],
    ]);
    return { q: T`$\dfrac{d}{dx}\,${tex}$`, a: ans, kind: 'expr', show: sh.replace(/^1(?=\D)/, '').replace(/^-1(?=\D)/, '-'), ...(dom && { dom }) };
  }},
  { id: 'calc-dprod', name: 'Product rule (simple)', par: 12, cat: 'calc', week: 6, weight: 1, gen() {
    const n = ri(2, 4);
    const [tex, ans, sh] = pick([[`x^{${n}}e^x`, `(${n}x^${n - 1} + x^${n})*e^x`, T`(${n}x^{${n - 1}} + x^{${n}})e^x`],
      [T`x^{${n}}\sin x`, `${n}x^${n - 1}*sin(x) + x^${n}*cos(x)`, T`${n}x^{${n - 1}}\sin x + x^{${n}}\cos x`],
      [T`x\ln x`, 'ln(x) + 1', T`\ln x + 1`], [T`e^x\sin x`, 'e^x*(sin(x) + cos(x))', T`e^x(\sin x + \cos x)`]]);
    return { q: T`$\dfrac{d}{dx}\,${tex}$`, a: ans, kind: 'expr', show: sh.replace(/x\^\{1\}/g, 'x') };
  }},
  { id: 'calc-onesided', name: 'One-sided limit', par: 7, cat: 'calc', week: 4, weight: 1, gen() {
    const a = nz(-3, 3), p = [ri(-2, 2), ri(-3, 3), ri(-5, 5)], r = [ri(-2, 2), ri(-3, 3), ri(-5, 5)], side = pick(['-', '+']);
    const val = (c, x) => c[0] * x * x + c[1] * x + c[2], pl = c => poly([[c[0], 'x^2'], [c[1], 'x'], [c[2], '']]);
    if (val(p, a) === val(r, a)) return null;
    const shift = `x ${a < 0 ? '+' : '-'} ${Math.abs(a)}`;
    return pick([
      { q: T`$f(x) = \begin{cases} ${pl(p)} & x < ${a} \\ ${pl(r)} & x \ge ${a} \end{cases}$. $\ \displaystyle\lim_{x \to ${a}^{${side}}} f(x) = ?$`, a: String(side === '-' ? val(p, a) : val(r, a)), kind: 'num' },
      { q: T`$\displaystyle\lim_{x \to ${a}^{${side}}} \frac{|${shift}|}{${shift}}$`, a: side === '-' ? '-1' : '1', kind: 'num' },
    ]);
  }},
  { id: 'calc-contcheck', name: 'Continuous? Limit exists?', par: 8, cat: 'calc', week: 4, weight: 1, gen() {
    const a = nz(-2, 3), L = ri(-5, 5), kind = pick(['jump', 'removable', 'continuous']), ask = pick(['cont', 'lim']);
    const R = kind === 'jump' ? L + nz(-3, 3) : L, v = kind === 'removable' ? L + nz(-3, 3) : L;
    const f = T`$f(x) = \begin{cases} ${poly([[1, 'x'], [L - a, '']])} & x < ${a} \\ ${v} & x = ${a} \\ ${poly([[2, 'x'], [R - 2 * a, '']])} & x > ${a} \end{cases}$`;
    const question = ask === 'cont' ? T`Continuous at $x = ${a}$?` : T`Does $\lim_{x \to ${a}} f(x)$ exist?`;
    return { q: `${f}<br>${question}`, a: ask === 'cont' ? kind === 'continuous' : kind !== 'jump', kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'calc-ivt', name: 'IVT: where is the root?', par: 15, cat: 'calc', week: 4, weight: 1, gen() {
    const c = [pick([1, -1]), ri(-3, 3), ri(-6, 6), ri(-9, 9)], f = x => ((c[0] * x + c[1]) * x + c[2]) * x + c[3];
    const xs = [-4, -3, -2, -1, 0, 1, 2, 3, 4], vs = xs.map(f);
    if (vs.some(v => v === 0)) return null;
    const changes = xs.slice(0, -1).filter((x, i) => vs[i] * vs[i + 1] < 0);
    if (changes.length !== 1) return null;
    return { q: T`$f(x) = ${poly([[c[0], 'x^3'], [c[1], 'x^2'], [c[2], 'x'], [c[3], '']])}$ changes sign exactly once on $[-4, 4]$, between $n$ and $n+1$. $\ n = ?$`,
             a: String(changes[0]), kind: 'num', hint: 'the integer n where f(n) and f(n+1) have opposite signs' };
  }},
  { id: 'calc-xalpha', name: 'Limit of x^α as α → ∞', par: 6, cat: 'calc', week: 4, weight: 1, gen() {
    const kind = pick(['zero', 'one', 'small', 'big']), p = ri(1, 3), q = p + ri(1, 3);
    const [xt, plain, th] = { zero: ['0', '0', '0'], one: ['1', '1', 'tanh(1)'], small: [frac(p, q).tex, '0', '0'], big: [frac(q, p).tex, 'inf', '1'] }[kind];
    const useTanh = Math.random() < 0.4, ans = useTanh ? th : plain;
    const q2 = T`$\displaystyle\lim_{\alpha\to\infty} ${useTanh ? T`\tanh(x^\alpha)` : T`x^\alpha`}$ for $x = ${xt}$`;
    return ans === 'inf' ? { q: q2, a: INF_ALIASES, kind: 'text', show: T`\infty`, hint: 'a number, or inf' }
                         : { q: q2, a: ans, kind: 'num', hint: 'a number, or inf' };
  }},
  { id: 'calc-liminfty', name: 'Limits at ±∞', par: 5, cat: 'calc', week: 4, weight: 1, gen() {
    const c = nz(-3, 3), dir = pick([1, -1]), k = ri(1, 4), cx = poly([[c, 'x']]), s = c * dir > 0;
    const [tex, ans] = pick([[`e^{${cx}}`, s ? 'inf' : '0'], [T`\tanh(${cx})`, s ? '1' : '-1'], [T`\sinh(${cx})`, s ? 'inf' : '-inf'],
      [T`\cosh(${cx})`, 'inf'], [xPow(k), dir > 0 || k % 2 === 0 ? 'inf' : '-inf'], [T`\frac{1}{${xPow(k)}}`, '0']]);
    const q = T`$\displaystyle\lim_{x\to ${dir > 0 ? '' : '-'}\infty} ${tex}$`;
    if (ans === 'inf') return { q, a: INF_ALIASES, kind: 'text', show: T`\infty`, hint: 'a number, inf or -inf' };
    if (ans === '-inf') return { q, a: INF_ALIASES.map(x => '-' + x), kind: 'text', show: T`-\infty`, hint: 'a number, inf or -inf' };
    return { q, a: ans, kind: 'num', hint: 'a number, inf or -inf' };
  }},

  // ---------- Sequences and Series ----------
  { id: 'seq-terms', name: 'Number of terms', par: 4, cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(-3, 8), b = a + ri(0, 15), body = pick(['k^2', '(2k+1)', '\\frac1k', '(-1)^k', '3^k']);
    if (body === '\\frac1k' && a <= 0 && b >= 0) return null;
    return { q: T`Number of terms in $\displaystyle\sum_{k=${a}}^{${b}} ${body}$`, a: String(b - a + 1), kind: 'num' };
  }},
  { id: 'seq-const', name: 'Constant sum', par: 5, cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(-2, 5), b = a + ri(1, 10), c = nz(-9, 9);
    return { q: T`$\displaystyle\sum_{k=${a}}^{${b}} ${c < 0 ? `(${c})` : c}$`, a: String(c * (b - a + 1)), kind: 'num' };
  }},
  { id: 'seq-const-n', name: 'Index-free sum', par: 6, cat: 'seq', week: 1, weight: 1, gen() {
    const [tex, s, sh] = pick([['n', 'n', 'n^2'], ['2n', '2n', '2n^2'], ['(n+1)', '(n+1)', 'n(n+1)'], ['n^2', 'n^2', 'n^3'], ['3', '3', '3n'], ['(n-1)', '(n-1)', 'n(n-1)']]);
    const j = pick(['j', 'k', 'i']);
    return { q: T`$\displaystyle\sum_{${j}=1}^{n} ${tex}$ (in terms of $n$)`, a: `n*${s}`, kind: 'expr', keys: N_KEYS, show: sh };
  }},
  { id: 'seq-linsum', name: 'Linear sum', par: 14, cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(0, 3), b = ri(a + 2, 9), c = ri(1, 5), d = ri(-5, 5);
    let s = 0;
    for (let k = a; k <= b; k++) s += c * k + d;
    return { q: T`$\displaystyle\sum_{k=${a}}^{${b}} (${poly([[c, 'k'], [d, '']])})$`, a: String(s), kind: 'num' };
  }},
  { id: 'seq-geosum', name: 'Geometric sum', par: 12, cat: 'seq', week: 1, weight: 1, gen() {
    const [p, q] = pick([[2, 1], [3, 1], [-2, 1], [1, 2], [-1, 2]]), lo = ri(0, 1), hi = ri(3, p === 3 ? 4 : 6);
    let num = 0;
    for (let k = lo; k <= hi; k++) num += p ** k * q ** (hi - k);
    const f = frac(num, q ** hi), r = frac(p, q);
    return { q: T`$\displaystyle\sum_{k=${lo}}^{${hi}} ${q === 1 && p > 0 ? p : T`\left(${r.tex}\right)`}^k$`, a: f.s, show: f.tex, kind: 'num' };
  }},
  { id: 'seq-closed', name: 'Closed-form sum', par: 14, cat: 'seq', week: 1, weight: 1, gen() {
    const c = ri(1, 6), d = ri(-5, 5);
    return { q: T`$\displaystyle\sum_{k=1}^{n} (${poly([[c, 'k'], [d, '']])})$ (in terms of $n$)`,
             a: `${c}*n(n+1)/2 + ${d}*n`, kind: 'expr', keys: N_KEYS,
             show: (c % 2 ? T`\frac{${c === 1 ? '' : c}n(n+1)}{2}` : `${c === 2 ? '' : c / 2}n(n+1)`) + (d ? ` ${d < 0 ? '-' : '+'} ${Math.abs(d) === 1 ? '' : Math.abs(d)}n` : '') };
  }},
  { id: 'seq-floor', name: 'Floor / ceiling', par: 3, cat: 'seq', week: 1, weight: 1, gen() {
    const x = pick([1, -1]) * (ri(0, 9) + ri(1, 9) / 10), f = pick(['floor', 'ceil']);
    const tex = f === 'floor' ? T`\lfloor ${x} \rfloor` : T`\lceil ${x} \rceil`;
    return { q: T`$${tex}$`, a: String(Math[f](x)), kind: 'num' };
  }},
  { id: 'seq-subsets', name: 'Subset count', par: 4, cat: 'seq', week: 1, weight: 1, gen() {
    const items = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, ri(1, 6));
    if (Math.random() < 0.25) items.splice(ri(0, items.length), 0, pick(items));   // a repeated element is still one element
    const n = new Set(items).size;
    return { q: T`Number of subsets of $\{${items.join(', ')}\}$`, a: String(2 ** n), kind: 'num' };
  }},
  { id: 'seq-count', name: 'Set size ℕ vs ℤ', par: 7, cat: 'seq', week: 1, weight: 1, gen() {
    const D = pick(['N', 'Z']), a = ri(-6, 4), b = a + ri(1, 10), lo = pick(['<', '\\le']), hi = pick(['<', '\\le']);
    let n = 0;
    for (let x = a; x <= b; x++) {
      const inLo = lo === '<' ? x > a : x >= a, inHi = hi === '<' ? x < b : x <= b;
      if (inLo && inHi && (D === 'Z' || x >= 1)) n++;
    }
    return { q: T`$\lvert\{x\in\mathbb ${D} : ${a} ${lo} x ${hi} ${b}\}\rvert$`, a: String(n), kind: 'num', hint: 'a number: how many elements' };
  }},
  { id: 'seq-interval', name: 'Interval ∩ / ∪', par: 9, cat: 'seq', week: 1, weight: 1, gen() {
    const I = randInterval(), J = randInterval(), op = pick(['cap', 'cup']);
    const res = op === 'cap' ? intersect(I, J) : union(I, J);
    if (!res) return null;
    return { q: T`$${ivTeX(I)} ${'\\' + op} ${ivTeX(J)}$`, a: res, kind: 'interval', show: setTeX(res) };
  }},
  { id: 'seq-modulus', name: '|x − a| as interval', par: 10, cat: 'seq', week: 3, weight: 1, gen() {
    const a = ri(-9, 9), r = ri(1, 9), rel = pick(['<', '\\le', '>', '\\ge']), closed = rel.includes('le') || rel.includes('ge');
    const [L, R] = closed ? ['[', ']'] : ['(', ')'];
    const res = rel === '<' || rel === '\\le' ? `${L}${a - r},${a + r}${R}` : `(-inf,${a - r}${R} U ${L}${a + r},inf)`;
    return { q: T`$\{x\in\mathbb R : \lvert ${poly([[1, 'x'], [-a, '']])} \rvert ${rel} ${r}\}$`, a: res, kind: 'interval', show: setTeX(res) };
  }},
  { id: 'seq-quant', name: 'Quantified statement', par: 7, cat: 'seq', week: 2, weight: 1, gen() {
    const [tex, truth] = pick(QUANT)(pick(['N', 'Z', 'R']), pick(['N', 'Z', 'R']), ri(-3, 3));

  { id: 'seq-injective', name: 'Injective / surjective', par: 6, cat: 'seq', week: 2, weight: 1, gen() {
    const a = ri(-5, 4), b = ri(a + 1, 5), f = pick(['x^2', '\\lvert x\\rvert']), k = ri(-3, 3), c = k - ri(0, 2);
    return pick([
      { q: T`$f:[${a},${b}]\to\mathbb R,\ f(x) = ${f}$. Injective?`, a: a >= 0 || b <= 0, kind: 'bool', labels: ['Yes', 'No'] },
      { q: T`$f:\mathbb R\to[${c},\infty),\ f(x) = ${poly([[1, 'x^2'], [k, '']])}$. Surjective?`, a: c === k, kind: 'bool', labels: ['Yes', 'No'] },
    ]);
  }},

  { id: 'seq-findN', name: 'Smallest N', par: 8, cat: 'seq', week: 4, weight: 1, gen() {
    const D = pick([100, 1000]), p = ri(1, D === 100 ? 20 : 30), eps = p / D, c = ri(2, 9), K = ri(10, 5000);
    const first = test => { for (let n = 1; ; n++) if (test(n)) return n; };
    const [tex, n] = pick([[T`\frac1n < ${eps}`, first(n => n * p > D)], [T`\frac{${c}}{n} < ${eps}`, first(n => n * p > c * D)],
      [T`\frac{1}{n^2} < ${eps}`, first(n => n * n * p > D)], [T`2^n > ${K}`, first(n => 2 ** n > K)], [T`\left(\tfrac12\right)^n < ${eps}`, first(n => 2 ** n * p > D)]]);
    return { q: T`Smallest $n \in \mathbb N$ with $${tex}$`, a: String(n), kind: 'num' };
  }},
  { id: 'seq-maxmin', name: 'Max / min of a set', par: 7, cat: 'seq', week: 4, weight: 1, gen() {

  { id: 'seq-supinf', name: 'Sup / inf of a set', par: 7, cat: 'seq', week: 5, weight: 1, gen() {

  { id: 'seq-negation', name: 'Correct negation?', par: 10, cat: 'seq', week: 2, weight: 1, gen() {

  { id: 'seq-isbound', name: 'Is t an upper/lower bound?', par: 5, cat: 'seq', week: 4, weight: 1, gen() {
    const { tex, sup, inf } = boundedSet(), upper = Math.random() < 0.5, yes = Math.random() < 0.5, out = upper ? 1 : -1;

             hint: 'an interval, e.g. [2,inf)' };

  { id: 'seq-modeq', name: '|x − a| = r', par: 5, cat: 'seq', week: 4, weight: 1, gen() {
    const a = ri(-9, 9), r = ri(1, 9);
    return { q: T`$\{x\in\mathbb R : \lvert ${poly([[1, 'x'], [-a, '']])} \rvert = ${r}\}$`, a: [`{${a - r},${a + r}}`, `{${a + r},${a - r}}`], kind: 'text',

  { id: 'calc-quot', name: "Quotient rule: f'(p)", par: 15, cat: 'calc', week: 6, weight: 1, gen() {

  { id: 'calc-defint', name: 'Definite integral', par: 12, cat: 'calc', week: 8, weight: 1, gen() {
    const k = ri(1, 4), m = ri(2, 6), n = ri(1, 3), c = nz(-4, 4), d = ri(-3, 3), p = ri(-2, 1), q = p + ri(1, 3);
    const poly1 = frac(c * (q ** (n + 1) - p ** (n + 1)) + d * (n + 1) * (q - p), n + 1), ek = k === 1 ? 'e' : `e^{${k}}`;
    const [tex, lo, hi, ans, show] = pick([
      [poly([[c, xPow(n)], [d, '']]), p, q, poly1.s, poly1.tex],
      [T`\cos(${poly([[k, 'x']])})`, 0, piFrac(1, 2 * k).tex, frac(1, k).s, frac(1, k).tex],
      [T`\sin(${poly([[k, 'x']])})`, 0, piFrac(1, k).tex, frac(2, k).s, frac(2, k).tex],
      [T`${c < 0 ? '-' : ''}\frac{${Math.abs(c)}}{x}`, 1, `e^{${m}}`, String(c * m), String(c * m)],
      [`${CAL_co(c)}e^{x}`, 0, T`\ln ${m}`, String(c * (m - 1)), String(c * (m - 1))],
      [CAL_eTex(k), 0, 1, `(e^${k}-1)/${k}`, k === 1 ? 'e - 1' : T`\frac{${ek} - 1}{${k}}`],
    ]);
    return { q: T`$\displaystyle\int_{${lo}}^{${hi}} ${tex}\,dx$`, a: ans, show, kind: 'num' };
  }},
  { id: 'calc-subst', name: 'Integration by substitution', par: 15, cat: 'calc', week: 9, weight: 1, gen() {
    const f = CAL_substOuter(), g = CAL_substInner(f.power), K = nz(-4, 4), co = frac(K, g.m * f.d);
    return { q: T`$\displaystyle\int ${CAL_co(K)}${g.dt}\,${f.tex(g.tex)}\,dx$`, a: `(${co.s})*${f.Fs(g.s)}`, kind: 'expr', upToConstant: true,
             show: `${CAL_fco(K, g.m * f.d)}${f.F(g.tex)} + c`, hint: 'any antiderivative; + c optional' };
  }},
  { id: 'calc-csq', name: 'Complete the square', par: 10, cat: 'calc', week: 9, weight: 1, gen() {
    const h = nz(-6, 6), k = ri(-9, 9), sg = (v) => v < 0 ? `-${-v}` : `+${v}`;
    return { q: T`Complete the square: $\ ${poly([[1, 'x^2'], [2 * h, 'x'], [h * h + k, '']])}$`, a: `(x${sg(h)})^2${k ? sg(k) : ''}`, kind: 'expr',
             pattern: /^\(x[+-]\d+\)\^2([+-]\d+)?$/, show: `(${poly([[1, 'x'], [h, '']])})^2${k ? (k < 0 ? ` - ${-k}` : ` + ${k}`) : ''}`, hint: 'the form (x-3)^2+2' };
  }},
  { id: 'calc-parts', name: 'Integration by parts', par: 18, cat: 'calc', week: 9, weight: 1, gen() {
    const a = nz(-3, 3), A = ri(1, 3), n = ri(0, 3), ax = poly([[A, 'x']]), N = n + 1;
    const [tex, ans, show] = pick([
      [`x${CAL_eTex(a)}`, `e^(${a}x)*(x/(${a}) - 1/${a * a})`, T`${CAL_eTex(a)}\left(${CAL_fco(1, a)}x - ${frac(1, a * a).tex}\right)`],
      [T`x\sin(${ax})`, `-x*cos(${A}x)/${A} + sin(${A}x)/${A * A}`, T`${CAL_fco(-1, A)}x\cos(${ax}) + ${CAL_fco(1, A * A)}\sin(${ax})`],
      [T`x\cos(${ax})`, `x*sin(${A}x)/${A} + cos(${A}x)/${A * A}`, T`${CAL_fco(1, A)}x\sin(${ax}) + ${CAL_fco(1, A * A)}\cos(${ax})`],
      [T`${xPow(n)}\ln x`, `x^${N}*ln(x)/${N} - x^${N}/${N * N}`, T`${CAL_fco(1, N)}${xPow(N)}\ln x - ${CAL_fco(1, N * N)}${xPow(N)}`],
    ]);
    return { q: T`$\displaystyle\int ${tex}\,dx$`, a: ans, kind: 'expr', upToConstant: true, show: show + ' + c', hint: 'any antiderivative; + c optional' };
  }},
  { id: 'calc-pf', name: 'Partial fractions', par: 15, cat: 'calc', week: 9, weight: 1, gen() {
    const A = nz(-5, 5), B = nz(-5, 5), r1 = ri(-4, 4), r2 = ri(-4, 4), lin = r => poly([[1, 'x'], [-r, '']]);
    const show = T`A = ${A},\ B = ${B}`, hint = 'A, B  e.g. 2, -3';
    if (Math.random() < 0.4) {   // (ax + b)/(x - r)^2 = A/(x - r) + B/(x - r)^2
      if (r1 === 0) return null;
      const L = lin(r1);
      return { q: T`$\dfrac{${poly([[A, 'x'], [B - A * r1, '']])}}{(${L})^2} = \dfrac{A}{${L}} + \dfrac{B}{(${L})^2}$. $\ A, B = ?$`, a: [A, B], kind: 'vec', show, hint };
    }
    if (r1 === r2) return null;
    const par = r => r === 0 ? 'x' : `(${lin(r)})`;
    return { q: T`$\dfrac{${poly([[A + B, 'x'], [-(A * r2 + B * r1), '']])}}{${par(r1)}${par(r2)}} = \dfrac{A}{${lin(r1)}} + \dfrac{B}{${lin(r2)}}$. $\ A, B = ?$`,
             a: [A, B], kind: 'vec', show, hint };
  }},
  { id: 'calc-improper', name: 'Improper integral', par: 10, cat: 'calc', week: 10, weight: 1, gen() {
    const a = ri(1, 6), c = ri(1, 5), d = pick([1, 2, 3]), m = ri(1, 3 * d), hint = 'a number, or diverges';
    if (gcd(m, d) !== 1) return null;
    const pw = d === 1 ? xPow(m) : d === 2 && m === 1 ? T`\sqrt{x}` : `x^{${frac(m, d).tex}}`, inv = T`\frac{1}{${pw}}`;
    const [tex, lo, hi, val] = pick([
      [`${CAL_co(c)}e^{-${poly([[a, 'x']])}}`, '0', T`\infty`, frac(c, a)],
      [CAL_eTex(a), '0', T`\infty`, null],
      [inv, '1', T`\infty`, m > d ? frac(d, m - d) : null],
      [inv, '0', '1', m < d ? frac(d, d - m) : null],
    ]);
    const q = T`$\displaystyle\int_{${lo}}^{${hi}} ${tex}\,dx$`;
    return val ? { q, a: val.s, show: val.tex, kind: 'num', hint } : { q, a: CAL_DIV, kind: 'text', show: T`\text{diverges}`, hint };
  }},
  { id: 'calc-ratio', name: 'Ratio test limit L', par: 10, cat: 'calc', week: 10, weight: 1, gen() {
    const c = ri(1, 5), d = ri(2, 6), k = ri(0, 3), s = pick([1, -1]), nk = k === 0 ? '' : k === 1 ? 'n' : `n^{${k}}`;
    const cn = c === 1 ? (s < 0 ? '(-1)^{n}' : '') : `${s < 0 ? `(-${c})` : c}^{n}`;
    if (c === d || !(cn + nk)) return null;
    const [an, L] = pick([
      [T`\frac{${cn}${nk}}{${d}^{n}}`, frac(c, d)],
      [T`\frac{${d}^{n}}{n!}`, frac(0, 1)],
      [T`\frac{n!}{${d}^{n}}`, null],
    ]);
    const q = T`$\displaystyle\sum_{n=1}^{\infty} ${an}$: $\ L = \lim_{n\to\infty}\left|\frac{a_{n+1}}{a_n}\right| = ?$`, hint = 'a number, or inf';
    return L ? { q, a: L.s, show: L.tex, kind: 'num', hint } : { q, a: INF_ALIASES, kind: 'text', show: T`\infty`, hint };
  }},
  { id: 'calc-radius', name: 'Radius of convergence', par: 10, cat: 'calc', week: 10, weight: 1, gen() {
    const c = ri(2, 6), k = ri(0, 3), nk = k === 0 ? '' : k === 1 ? 'n' : `n^{${k}}`;
    const [term, R] = pick([
      [T`\frac{${nk || '1'}}{${c}^{n}}`, frac(c, 1)],
      [k ? T`\frac{${c}^{n}}{${nk}}` : `${c}^{n}`, frac(1, c)],
      [T`\frac{${c}^{n}}{n!}`, null],
      [nk ? T`${nk}\cdot n!` : 'n!', frac(0, 1)],
    ]);
    const q = T`Radius of convergence $R$ of $\displaystyle\sum_{n=1}^{\infty} ${term}\,x^{n}$`, hint = 'a number, or inf';
    return R ? { q, a: R.s, show: R.tex, kind: 'num', hint } : { q, a: INF_ALIASES, kind: 'text', show: T`\infty`, hint };
  }},
  { id: 'calc-taylor', name: 'Taylor coefficient by substitution', par: 10, cat: 'calc', week: 11, weight: 1, gen() {
    const name = pick(Object.keys(CAL_TAYLOR)), k = pick([1, -1, 2, -2, 3, -3]), m = pick([1, 2]), n = ri(1, 6);
    if (n % m && Math.random() < 0.85) return null;
    if (['exp', 'sin', 'cos'].includes(name) && m === 1 && (name === 'exp' ? Math.abs(k) <= 2 : k === 1)) return null;   // calc-series has these
    const [texOf, coef] = CAL_TAYLOR[name], j = n / m, [p, q] = n % m ? [0, 1] : coef(j), f = frac(p * k ** j, q);
    if (f.s === '0' && Math.random() < 0.6) return null;
    return { q: T`Coefficient of $${xPow(n)}$ in the Taylor series of $${texOf(poly([[k, xPow(m)]]))}$ at $x = 0$`, a: f.s, show: f.tex, kind: 'num' };
  }},
  { id: 'calc-taylora', name: 'Taylor coefficient at x = a', par: 10, cat: 'calc', week: 11, weight: 1, gen() {
    const a = ri(1, 3), n = ri(1, 5), b = pick([1, 2, -1]), sh = c => poly([[1, 'x'], [-c, '']]), pw = c => `(${sh(c)})${n === 1 ? '' : `^{${n}}`}`;
    const ln = frac((-1) ** (n + 1), n * a ** n), inv = frac((-1) ** n, a ** (n + 1)), eb = b === 1 ? 'e' : `e^{${b}}`;
    const [f, at, ans, show] = pick([
      ['e^{x}', b, `e^(${b})/${fact(n)}`, n === 1 ? eb : T`\frac{${eb}}{${fact(n)}}`],
      [T`\ln x`, a, ln.s, ln.tex],
      [T`\frac{1}{x}`, a, inv.s, inv.tex],
    ]);
    return { q: T`Coefficient of $${pw(at)}$ in the Taylor series of $${f}$ at $x = ${at}$`, a: ans, show, kind: 'num' };
  }},
  { id: 'calc-lhopform', name: "0/0 or ∞/∞? (l'Hôpital)", par: 6, cat: 'calc', week: 11, weight: 1, gen() {
    return balanced(() => {
      const at0 = Math.random() < 0.5, [nt, nc] = CAL_formTerm(at0), [dt, dc] = CAL_formTerm(at0);
      if (nt === dt) return null;
      return { q: T`Is $\displaystyle\lim_{x\to ${at0 ? '0^+' : T`\infty`}} \frac{${nt}}{${dt}}$ of the form $\frac{0}{0}$ or $\frac{\infty}{\infty}$?`,
               a: nc === dc && nc !== 'f', kind: 'bool', labels: ['Yes', 'No'] };
    }, q => q.a);
  }},
  { id: 'calc-lhop', name: "l'Hôpital limit", par: 15, cat: 'calc', week: 11, weight: 1, gen() {
    const a = nz(-4, 4), b = nz(-4, 4), A = ri(1, 3), n = ri(2, 5), m = ri(2, 5), ax = poly([[a, 'x']]);
    const [tex, at, f] = pick([
      [T`\frac{${CAL_eTex(a)} - 1}{${poly([[b, 'x']])}}`, '0', frac(a, b)],
      [T`\frac{\ln(${poly([[1, ''], [a, 'x']])})}{${poly([[b, 'x']])}}`, '0', frac(a, b)],
      [T`\frac{${CAL_eTex(a)} - ${CAL_eTex(b)}}{x}`, '0', a === b ? null : frac(a - b, 1)],
      [T`\frac{${poly([[1, `e^{${ax}}`], [-1, ''], [-a, 'x']])}}{x^2}`, '0', frac(a * a, 2)],
      [T`\frac{${poly([[A, 'x']])} - \sin(${poly([[A, 'x']])})}{x^3}`, '0', frac(A ** 3, 6)],
      [T`\frac{\cosh(${poly([[A, 'x']])}) - 1}{x^2}`, '0', frac(A * A, 2)],
      [T`\frac{x^{${n}} - 1}{x^{${m}} - 1}`, '1', n === m ? null : frac(n, m)],
    ]);
    if (!f) return null;
    return { q: T`$\displaystyle\lim_{x\to ${at}} ${tex}$`, a: f.s, show: f.tex, kind: 'num' };
  }},
  // ---------- Elementary Logic: predicate logic, natural deduction, sets (LG_ helpers) ----------
  { id: 'logic-ndrule', name: 'Name the ND rule', par: 8, cat: 'logic', week: 5, weight: 1, gen() {
    const [op, kind, nums, step] = LG_propStep();
    return { q: `Which rule? ${step}`, ...LG_ruleAnswer(op, kind, nums), kind: 'text', keys: LG_RULE_KEYS, noKeyboard: true, hint: 'rule name, e.g. ∧Elim1 or →Intro' };
  }},
  { id: 'logic-goalrule', name: 'Rule for the goal', par: 4, cat: 'logic', week: 5, weight: 1, gen() {
    const f = rf(2, ['P', 'Q', 'R']);
    if (typeof f === 'string' || depth(f) < 2) return null;
    return { q: `Which introduction rule gives ${LG_f(show(f))} as its last step?`, ...LG_ruleAnswer(f.op, 'Intro', f.op === '∨' ? ['', '1', '2'] : ['']),
             kind: 'text', keys: LG_RULE_KEYS, noKeyboard: true, hint: 'rule name, e.g. ∧Intro' };
  }},
  { id: 'logic-ndassume', name: 'What to assume', par: 7, cat: 'logic', week: 6, weight: 1, gen() {
    const [text, ans] = LG_assumeStep(), forms = [...new Set([show(ans), official(ans)])];
    return { q: `${text} what?`, a: forms, show: LG_tex(forms[0]), kind: 'syntax', keys: LOGIC_KEYS, noKeyboard: true, hint: 'the assumption, e.g. ¬(P ∧ Q)' };
  }},
  { id: 'logic-setop', name: 'Set operation', par: 10, cat: 'logic', week: 5, weight: 1, gen() {
    const A = LG_randSet(1, 6, ri(2, 4)), B = LG_randSet(1, 6, ri(2, 4)), [op, keep] = pick([
      [T`\cup`, x => A.includes(x) || B.includes(x)], [T`\cap`, x => A.includes(x) && B.includes(x)], [T`\setminus`, x => A.includes(x) && !B.includes(x)]]);
    const res = [1, 2, 3, 4, 5, 6].filter(keep);
    return { q: T`$${LG_setTeX(A)} ${op} ${LG_setTeX(B)}$`, a: `{${res.join(',')}}`, show: LG_setTeX(res), kind: 'set', hint: 'a set, e.g. {1,3}, or {} for ∅' };
  }},
  { id: 'logic-setmember', name: '∈ or ⊆?', par: 7, cat: 'logic', week: 5, weight: 1, gen() {
    const make = () => {
      const S = [LG_randElement(), LG_randElement(), LG_randElement()], sub = Math.random() < 0.5;
      const X = sub ? pick([[pick(S)], [pick(S), pick(S)], [], [ri(1, 3)]]) : pick([pick(S), pick(S), LG_randElement(), [pick(S)]]);
      if (LG_card(S) < 3) return null;
      const yes = sub ? X.every(x => LG_member(x, S)) : LG_member(X, S);
      return { q: T`True? $\ ${LG_setTeX(X)} ${sub ? T`\subseteq` : T`\in`} ${LG_setTeX(S)}$`, yes };
    };
    const r = balanced(make, x => x.yes);
    return r && { q: r.q, a: r.yes, kind: 'bool', labels: ['True', 'False'] };
  }},
  { id: 'logic-setcard', name: 'Cardinality', par: 8, cat: 'logic', week: 5, weight: 1, gen() {
    if (Math.random() < 0.3) {
      const A = Array.from({ length: ri(2, 4) }, () => ri(1, 3)), B = Array.from({ length: ri(2, 3) }, () => ri(1, 4));
      return { q: T`$|A \times B|$ for $A = \{${A.join(', ')}\},\ B = \{${B.join(', ')}\}$`, a: String(LG_card(A) * LG_card(B)), kind: 'num' };
    }
    const S = Array.from({ length: ri(3, 5) }, LG_randElement);
    return { q: T`$\left|\,\{${S.map(LG_setTeX).join(', ')}\}\,\right|$`, a: String(LG_card(S)), kind: 'num', hint: 'how many distinct elements' };
  }},
  { id: 'logic-relprop', name: 'Relation property', par: 15, cat: 'logic', week: 6, weight: 1, gen() {
    const prop = pick(Object.keys(LG_REL)), rel = balanced(LG_randRelation, r => LG_REL[prop](r.R, r.D, r.has));
    return rel && { q: T`Is $R = ${LG_pairsTeX(rel.R)}$ ${prop} over $\{${rel.D.join(', ')}\}$?`, a: LG_REL[prop](rel.R, rel.D, rel.has), kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'logic-l2formal', name: 'Formalise in L2', par: 15, cat: 'logic', week: 7, weight: 1, gen() {
    const { english, trees, dict } = LG_formalise(), a = LG_answers(trees, false);
    return { q: `Formalise in L<sub>2</sub>: ${LG_f(english + '.')}<br><span class="muted">${dict}</span>`, a, show: LG_tex(a[0]), kind: 'syntax',
             keys: ['∀', '∃', 'x', 'y', 'a', 'P', 'Q', 'R', '¬', '∧', '∨', '→', '(', ')'], noKeyboard: true, hint: 'e.g. ∀x(Px → Qx); use x, then y', check: LG_sameOn(trees) };
  }},
  { id: 'logic-freebound', name: 'Free or bound?', par: 6, cat: 'logic', week: 7, weight: 1, gen() {
    const make = () => {
      const f = LG_rand(3), occ = LG_occ(f), k = ri(0, occ.length - 1);
      return LG_okRand(f) && occ.length > 1 ? { f, k, free: occ[k].free } : null;
    };
    const r = balanced(make, x => x.free);
    return r && { q: `Is the underlined occurrence of ${LG_occ(r.f)[r.k].v} free or bound?<br>${LG_f(LG_str(r.f, { conv: true, mark: r.k }))}`, a: r.free, kind: 'bool', labels: ['Free', 'Bound'] };
  }},
  { id: 'logic-freevars', name: 'Free variables', par: 10, cat: 'logic', week: 7, weight: 1, gen() {
    const f = LG_rand(3), free = [...LG_free(f)].sort();
    if (!LG_okRand(f) || LG_occ(f).length < 2) return null;
    return { q: `Set of variables that occur freely in ${LG_f(LG_str(f))}`, a: `{${free.join(',')}}`, show: free.length ? T`\{${free.join(', ')}\}` : T`\varnothing`,
             kind: 'set', keys: ['{', '}', ',', 'x', 'y', 'z'], noKeyboard: true, hint: 'e.g. {x,y}, or {} if none' };
  }},
  { id: 'logic-l2sentence', name: 'Sentence of L2?', par: 8, cat: 'logic', week: 7, weight: 1, gen() {
    const f = balanced(() => { const g = LG_rand(3); return LG_okRand(g) && LG_size(g) >= 4 ? g : null; }, g => LG_free(g).size === 0);
    return f && { q: `Is this a sentence of L<sub>2</sub> (no variable occurs freely)?<br>${LG_f(LG_str(f))}`, a: LG_free(f).size === 0, kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'logic-l2true', name: 'True in the structure?', par: 25, cat: 'logic', week: 8, weight: 1, gen() {
    const r = balanced(() => { const f = LG_structSentence(); return f && { f, M: LG_structModel() }; }, ({ f, M }) => LG_ev(f, M));
    return r && { q: T`$${LG_modelTeX(r.M, r.f)}$<br>True? ${LG_f(LG_str(r.f))}`, a: LG_ev(r.f, r.M), kind: 'bool', labels: ['True', 'False'] };
  }},
  { id: 'logic-quantneg', name: 'Quantifier negation', par: 15, cat: 'logic', week: 8, weight: 1, gen() {
    const f = LG_negSentence();
    if (!f) return null;
    const a = LG_answers([LG_nnf(f)], true);
    return { q: `Equivalent sentence with ¬ only directly before atomic formulas:<br>${LG_f(LG_str(f))}`, a, show: LG_tex(a[0]), kind: 'syntax',
             keys: ['∀', '∃', 'x', 'y', 'P', 'Q', 'R', '¬', '∧', '∨', '→', '(', ')'], noKeyboard: true, check: LG_sameOn([f, LG_nnf(f)]) };
  }},
  { id: 'logic-subst', name: 'Substitution φ[a/x]', par: 15, cat: 'logic', week: 9, weight: 1, gen() {
    const f = LG_substFormula(), t = pick(['a', 'b']);
    if (!f) return null;
    const a = [...new Set(LG_forms(LG_sub(f, t, 'x')))];
    return { q: `φ = ${LG_f(LG_str(f))}<br>Write φ[${t}/x]`, a, show: LG_tex(a[0]), kind: 'syntax',
             keys: ['∀', '∃', 'x', 'y', 'z', t, 'P', 'Q', 'R', '¬', '∧', '∨', '→', '↔', '(', ')'], noKeyboard: true, hint: 'replace only the free occurrences of x' };
  }},
  { id: 'logic-ndrule2', name: 'Name the quantifier rule', par: 8, cat: 'logic', week: 9, weight: 1, gen() {
    const [op, kind, nums, step] = LG_predStep();
    return { q: `Which rule? ${step}`, ...LG_ruleAnswer(op, kind, nums), kind: 'text', keys: ['∀', '∃', '=', 'Intro', 'Elim'], noKeyboard: true, hint: 'rule name, e.g. ∀Elim' };
  }},
  { id: 'logic-quantlegal', name: '∀Intro / ∃Elim legal?', par: 15, cat: 'logic', week: 9, weight: 1, gen() {
    const r = balanced(LG_quantStep, x => x.legal);
    return r && { q: `${r.q}<br>Is this step legal?`, a: r.legal, kind: 'bool', labels: ['Legal', 'Illegal'] };
  }},
  { id: 'logic-eqelim', name: '=Elim result', par: 15, cat: 'logic', week: 10, weight: 1, gen() {
    const phi = LG_rqf([LG_at('P', 'x'), LG_at('Q', 'x'), LG_at('R', 'x', 'a'), LG_at('R', 'a', 'x'), LG_at('R', 'x', 'x'), LG_at('P', 'a')], 1);
    if (!LG_free(phi).has('x') || !LG_consts(phi).includes('a')) return null;
    const id = pick(['a = b', 'b = a']), a = [...new Set(LG_forms(LG_sub(phi, 'b', 'x')))];
    return { q: `φ = ${LG_f(LG_str(phi))}<br>From ${LG_f(LG_str(LG_sub(phi, 'a', 'x')))} and ${LG_f(id)}, =Elim gives φ[b/x] = ?`, a, show: LG_tex(a[0]), kind: 'syntax',
             keys: ['P', 'Q', 'R', 'a', 'b', '¬', '∧', '∨', '→', '(', ')'], noKeyboard: true };
  }},
  { id: 'logic-mindomain', name: 'Smallest domain', par: 15, cat: 'logic', week: 10, weight: 1, gen() {
    const f = Math.random() < 0.25 ? LG_countClaim() : and(LG_countClaim(), LG_countClaim()), n = LG_minDomain(f);
    if (!n || LG_size(f) > 16) return null;
    return { q: `Smallest domain size in which ${LG_f(LG_str(f))} is true?`, a: String(n), kind: 'num' };
  }},
];

<script>
const T = String.raw;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

const nz = (a, b) => { let v; do v = ri(a, b); while (v === 0); return v; };

// Redraw make() until key() matches a fair coin, so yes/no answers come out about 50/50

const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const shuffle = arr => arr.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const colv = v => T`\begin{pmatrix}${v.join('\\\\')}\end{pmatrix}`;
const matTeX = M => T`\begin{pmatrix}${M.map(r => r.join('&')).join('\\\\')}\end{pmatrix}`;
const divisors = n => { const out = []; for (let d = 1; d <= Math.abs(n); d++) if (n % d === 0) out.push(d, -d); return out; };

// Reduced fraction p/q -> { s: 'p/q', tex }
function frac(p, q) {

  return { s: `${p}/${q}`, tex: (p < 0 ? '-' : '') + T`\frac{${Math.abs(p)}}{${q}}` };

// m*pi/d -> { s: '2pi/3', tex: '\frac{2\pi}{3}' }
function piFrac(m, d) {

// [[coef, 'x^2'], [coef, '']] -> '3x^2 - x + 2'
function poly(terms) {

const STD_ANGLES = Array.from({ length: 49 }, (_, i) => i - 24).filter(m => m % 2 === 0 || m % 3 === 0);
const SIN_VALUES = [0, 1 / 2, Math.SQRT1_2, Math.sqrt(3) / 2, 1];
const TAN_VALUES = [0, 1 / Math.sqrt(3), 1, Math.sqrt(3)];
const EXACT = [['0', '0', 0], ['1/2', T`\frac{1}{2}`, 0.5], ['sqrt(2)/2', T`\frac{\sqrt2}{2}`, Math.SQRT1_2],
  ['sqrt(3)/2', T`\frac{\sqrt3}{2}`, Math.sqrt(3) / 2], ['1', '1', 1], ['sqrt(3)/3', T`\frac{\sqrt3}{3}`, 1 / Math.sqrt(3)],

  const [s, tex] = EXACT.find(e => Math.abs(Math.abs(v) - e[2]) < 1e-9);

}

function pythagorean() {
  const [base, len] = pick([[[3, 4], 5], [[2, 3, 6], 7], [[1, 2, 2], 3], [[2, 6, 9], 11], [[4, 4, 7], 9], [[1, 4, 8], 9], [[6, 6, 7], 11], [[2, 10, 11], 15], [[5, 12], 13]]);
  return [shuffle(base).map(x => x * pick([1, -1])), len];

const cx = (a, b) => {
  if (b === 0) return String(a);
  const im = Math.abs(b) === 1 ? 'i' : `${Math.abs(b)}i`;
  if (a === 0) return (b < 0 ? '-' : '') + im;
  return `${a}${b < 0 ? '-' : '+'}${im}`;

const CX_KEYS = ['i', '+', '-', '(', ')'];
const N_KEYS = ['n', '^', '*', '/', '(', ')', '+', '-'];

// Point at angle m*pi/12 with scale k, exact coordinates as { tex, v }
function argPoint(m, k) {

    const a = Math.abs(x);
    if (a < 1e-9) return { tex: '0', v: 0 };
    const sg = x < 0 ? -1 : 1;
    if (Math.abs(a - 1) < 1e-9) return { tex: String(sg * 2 * k), v: sg * 2 * k };
    if (Math.abs(a - 0.5) < 1e-9) return { tex: String(sg * k), v: sg * k };
    if (Math.abs(a - Math.SQRT1_2) < 1e-9) return { tex: String(sg * k), v: sg * k };

}
function cxTeX(re, im) {
  if (im.v === 0) return re.tex;
  const imAbs = im.tex.replace('-', ''), imPart = (imAbs === '1' ? '' : imAbs) + 'i';
  if (re.v === 0) return (im.v < 0 ? '-' : '') + imPart;
  return `${re.tex} ${im.v < 0 ? '-' : '+'} ${imPart}`;
}

const overA = (num, a) => Math.abs(a) === 1 ? (a < 0 ? (/\s[-+]\s/.test(num) ? T`-(${num})` : `-${num}`) : num) : T`${a < 0 ? '-' : ''}\frac{${num}}{${Math.abs(a)}}`;
// Composition building blocks: u is the slot
const OUTER = [{ tex: 'u^2', s: 'u^2', sh: '(U)^2' }, { tex: 'u^3', s: 'u^3', sh: '(U)^3' }, { tex: 'u + 3', s: 'u + 3', sh: 'U + 3' }, { tex: '2u', s: '2u', sh: '2(U)' },
  { tex: 'e^u', s: 'e^u', sh: 'e^{U}' }, { tex: T`\sqrt u`, s: 'sqrt(u)', sh: T`\sqrt{U}` }, { tex: T`\sin u`, s: 'sin(u)', sh: T`\sin(U)` },
  { tex: T`\ln u`, s: 'ln(u)', sh: T`\ln(U)` }, { tex: T`\frac1u`, s: '1/u', sh: T`\frac{1}{U}` }];
const INNER = [{ tex: 'u^2', s: 'u^2', sh: '(U)^2' }, { tex: 'u^3', s: 'u^3', sh: '(U)^3' }, { tex: 'u + 2', s: 'u + 2', sh: 'U + 2' }, { tex: '3u', s: '3u', sh: '3(U)' },
  { tex: 'e^u', s: 'e^u', sh: 'e^{U}' }, { tex: T`\sqrt u`, s: 'sqrt(u)', sh: T`\sqrt{U}` }, { tex: T`\frac1u`, s: '1/u', sh: T`\frac{1}{U}` }];

const xPow = p => p <= 0 ? '' : p === 1 ? 'x' : `x^{${p}}`;
const fact = n => n <= 1 ? 1 : n * fact(n - 1);
const SERIES = [
  () => { const a = pick([1, -1, 2, -2]); return [a === 1 ? 'e^{x}' : `e^{${a}x}`.replace('{-1x}', '{-x}'), n => [a ** n, fact(n)]]; },
  () => [T`\sin x`, n => [n % 2 ? (-1) ** ((n - 1) / 2) : 0, fact(n)]],
  () => [T`\cos x`, n => [n % 2 ? 0 : (-1) ** (n / 2), fact(n)]],
];

// Intervals: { lo, hi, lc, hc } with +-Infinity allowed (always open there)
function randInterval() {
  const lo = Math.random() < 0.15 ? -Infinity : ri(-5, 3);
  const hi = Math.random() < 0.15 ? Infinity : ri(Math.max(lo, -5) + 1, 6);
  return { lo, hi, lc: lo > -Infinity && Math.random() < 0.5, hc: hi < Infinity && Math.random() < 0.5 };
}
function intersect(I, J) {
  const [lo, lc] = I.lo > J.lo ? [I.lo, I.lc] : J.lo > I.lo ? [J.lo, J.lc] : [I.lo, I.lc && J.lc];
  const [hi, hc] = I.hi < J.hi ? [I.hi, I.hc] : J.hi < I.hi ? [J.hi, J.hc] : [I.hi, I.hc && J.hc];

  const [hi, hc] = I.hi > J.hi ? [I.hi, I.hc] : J.hi > I.hi ? [J.hi, J.hc] : [I.hi, I.hc || J.hc];

function ivStr({ lo, hi, lc, hc }) {
  if (lo === hi) return `{${lo}}`;

  const e = x => x === Infinity ? 'inf' : x === -Infinity ? '-inf' : x;

const ivTeX = I => setTeX(ivStr(I));
const setTeX = s => s.replace(/inf/g, T`\infty`).replace(/ U /g, T` \cup `)
  .replace(/\{/g, T`\{`).replace(/\}/g, T`\}`).replace(/^R$/, T`\mathbb R`).replace('∅', T`\varnothing`);

// Quantified statements over N = {1,2,...}, Z, R: (A, B, c) -> [tex, truth]
const bb = D => T`\mathbb ${D}`;
const plusC = (v, c) => poly([[1, v], [c, '']]);
const QUANT = [
  (A, B, c) => [T`\forall x \in ${bb(A)}\ \exists y \in ${bb(B)} :\ y = ${plusC('x', c)}`, A === 'R' ? B === 'R' : B !== 'N' || (A === 'N' && c >= 0)],
  (A, B, c) => [T`\exists y \in ${bb(B)}\ \forall x \in ${bb(A)} :\ y \le ${plusC('x', c)}`, A === 'N' && (B !== 'N' || c >= 0)],
  (A, B) => [T`\forall x \in ${bb(A)}\ \exists y \in ${bb(B)} :\ y < x`, B !== 'N'],
  (A, B) => [T`\forall x \in ${bb(A)}\ \exists y \in ${bb(B)} :\ y^2 = x`, A === 'N' && B === 'R'],
  (A, B, c) => { const k = c * c + ri(-1, 1) * ri(0, 2); return [T`\exists x \in ${bb(A)} :\ x^2 = ${k}`, sqHas(A, k)]; },
  (A, B, c) => [T`\forall x \in ${bb(A)} :\ x \ge ${c}`, A === 'N' && c <= 1],
  (A, B, c) => { const a = nz(-4, 4), b = ri(-12, 12); return [T`\exists x \in ${bb(A)} :\ ${poly([[a, 'x']])} = ${b}`, rootIn(A, b / a)]; },

function sqHas(A, k) {
  const r = Math.sqrt(k);
  if (A === 'R') return k >= 0;
  return Number.isInteger(r) && (A === 'Z' || r >= 1);
}
const rootIn = (A, x) => A === 'R' || (Number.isInteger(x) && (A === 'Z' || x >= 1));

// Max/min (week 4) or sup/inf (week 5) of an interval or of {c + d/n : n ∈ N}. "none" when it does not exist.
function boundsQuestion([hiName, loName]) {
  const ask = pick([hiName, loName]), isHi = ask === hiName, exists = hiName === 'max';
  let tex, hi, lo;
  if (Math.random() < 0.5) {
    const I = randInterval();
    if (I.lo === -Infinity && I.hi === Infinity) return null;
    tex = ivTeX(I);
    hi = I.hi === Infinity ? null : (!exists || I.hc) ? I.hi : null;
    lo = I.lo === -Infinity ? null : (!exists || I.lc) ? I.lo : null;

const OPP_REL = { '<': '>', '\\le': '\\ge', '>': '<', '\\ge': '\\le' };
const NEG_DOM = { '> 0': '\\le 0', '\\ge N': '< N' };
const NEG_TEMPLATES = [

  () => ({ qs: [{ q: '∃', v: 'M', dom: '\\in\\mathbb R' }, { q: '∀', v: 'n', dom: '\\in\\mathbb N' }], lhs: 'a_n', rel: pick(['\\le', '<']), rhs: 'M' }),
  () => ({ qs: [{ q: '∀', v: 'x', dom: '\\in\\mathbb R' }, { q: '∃', v: 'y', dom: '\\in\\mathbb R' }], lhs: 'y', rel: pick(['>', '\\ge']), rhs: 'x' }),
  () => ({ qs: [{ q: '∃', v: 'x', dom: '\\in\\mathbb N' }, { q: '∀', v: 'y', dom: '\\in\\mathbb N' }], lhs: 'x', rel: pick(['\\le', '<']), rhs: 'y' }),

  st => { const i = st.qs.findIndex(x => NEG_DOM[x.dom]); if (i < 0) return null;

const det3 = ([a, b, c]) => a[0] * (b[1] * c[2] - b[2] * c[1]) - a[1] * (b[0] * c[2] - b[2] * c[0]) + a[2] * (b[0] * c[1] - b[1] * c[0]);
const INF_ALIASES = ['inf', '∞', '+inf', 'infinity', '+∞'];
const BOUND_ALIASES = { above: ['above', 'above only', 'bounded above'], below: ['below', 'below only', 'bounded below'],
  both: ['both', 'bounded'], neither: ['neither', 'none', 'unbounded'] };
// Subspace families (Def 4.3: closed under + and scalar multiples; every subspace contains 0)

// Sets for bounded / upper-bound questions: intervals, unions, and {c + d/n}
function boundedSet() {

// ---------- Linear algebra, weeks 6-11 (linear maps, rank, change of basis, determinants, eigen) ----------
const LA_T = M => M[0].map((_, j) => M.map(r => r[j]));
const LA_matmul = (A, B) => A.map(r => B[0].map((_, j) => r.reduce((s, x, k) => s + x * B[k][j], 0) + 0));
const LA_det2 = M => M[0][0] * M[1][1] - M[0][1] * M[1][0];
// Minor M_ij(A) and cofactor C_ij(A) = (-1)^(i+j) M_ij(A) of a 3×3 matrix, 0-based i, j (Def 5.2.16)
const LA_minor = (A, i, j) => LA_det2(A.filter((_, r) => r !== i).map(r => r.filter((_, c) => c !== j)));
const LA_cof = (A, i, j) => (-1) ** (i + j) * LA_minor(A, i, j);
const LA_tPow = p => p === 0 ? '' : p === 1 ? 't' : `t^{${p}}`;

// 3×3 integer matrix with det ±1 or ±2: unit lower × upper triangular, rows shuffled
function LA_smallDet3() {
  const L = [[1, 0, 0], [ri(-2, 2), 1, 0], [ri(-2, 2), ri(-2, 2), 1]];
  const d = shuffle([pick([1, -1, 2, -2]), pick([1, -1]), pick([1, -1])]);
  const U = [[d[0], ri(-2, 2), ri(-2, 2)], [0, d[1], ri(-2, 2)], [0, 0, d[2]]];
  const A = shuffle(LA_matmul(L, U)), flat = A.flat();
  return flat.some(x => Math.abs(x) > 9) || flat.filter(x => x === 0).length > 3 ? null : A;
}
// 2×2 integer matrix with entries in [lo, hi] and determinant in dets
function LA_smallDet2(lo, hi, dets) {
  for (let i = 0; i < 200; i++) { const M = mat(2, 2, lo, hi); if (dets.includes(LA_det2(M))) return M; }
  return null;
}
// Inverse of a 2×2 matrix: numbers for the checker, exact fractions for display
function LA_inv2(M) {
  const d = LA_det2(M), adj = [[M[1][1], -M[0][1]], [-M[1][0], M[0][0]]];
  return { a: adj.map(r => r.map(x => x / d + 0)), show: matTeX(adj.map(r => r.map(x => frac(x, d).tex))) };
}
// P D P^{-1} with an integer P of determinant ±1, so the result is an integer matrix
function LA_similar2(D) {
  const P = LA_smallDet2(-2, 2, [1, -1]);
  return { P, A: LA_matmul(LA_matmul(P, D), LA_inv2(P).a).map(r => r.map(x => Math.round(x) + 0)) };
}
// Rank by Gaussian elimination (floating point; inputs are small integers)
function LA_rank(M) {
  const A = M.map(r => [...r]);
  let rank = 0;
  for (let c = 0; c < A[0].length && rank < A.length; c++) {
    const p = A.findIndex((r, i) => i >= rank && Math.abs(r[c]) > 1e-9);
    if (p < 0) continue;
    [A[rank], A[p]] = [A[p], A[rank]];
    for (let i = rank + 1; i < A.length; i++) { const f = A[i][c] / A[rank][c]; A[i] = A[i].map((x, k) => x - f * A[rank][k]); }
    rank++;
  }
  return rank;
}

// Three elementary row operations on an n×n matrix, worded like the exam (May 2026 A11), and their det factor
function LA_rowOps(n) {
  const ops = [];
  let f = 1;
  for (const kind of shuffle(['scale', 'add', 'swap', pick(['scale', 'add', 'swap'])]).slice(0, 3)) {
    const [i, j] = shuffle(Array.from({ length: n }, (_, k) => k + 1)).slice(0, 2), k = pick([2, 3, 4, -1, -2, -3]);
    if (kind === 'scale') { ops.push(`multiply row ${i} by $${k}$`); f *= k; }
    else if (kind === 'add') ops.push(`add $${k}$ times row ${j} to row ${i}`);
    else { ops.push(`interchange row ${i} and row ${j}`); f = -f; }
  }
  return { steps: ops.map((s, k) => `(${k + 1}) ${s}`).join('; '), f };
}
// Determinant rules (Thm 5.2.12, 5.2.14, multilinearity): (n, k, d, e) -> [tex, numerator, denominator]
const LA_DET_RULES = [
  (n, k, d) => [T`\det(${k}A)`, k ** n * d, 1],
  (n, k, d, e) => [T`\det(A^T B)`, d * e, 1],
  (n, k, d) => [T`\det(A^{-1})`, 1, d],
  (n, k, d, e) => [T`\det(A^2 B^{-1})`, d * d, e],
  (n, k, d, e) => [T`\det(${k}A^T B)`, k ** n * d * e, 1],
  (n, k, d, e) => [T`\det(B^{-1} A B)`, d, 1],
  (n, k, d, e) => [T`\det(A^{-1} B^3)`, e ** 3, d],
];

  n => [T`a_{11} + a_{22} + \dots + a_{${n}${n}} = 0`, n * n - 1],

const LA_LIN_FAMILIES = [

  () => { const bad = pick(['xy', 'x^2', 'y^2', T`\lvert x\rvert`, T`\lvert y\rvert`, 'x^3']);
    return { tex: T`T:\mathbb R^2\to\mathbb R^2,\ T(x, y) = (${poly([[nz(-3, 3), 'x'], [nz(-3, 3), bad]])},\ ${poly([[nz(-3, 3), 'y']])})`, a: false }; },
  () => { const k = pick([2, 3, -1, -2]), m = ri(2, 3);

// Polynomial maps on P_2 in the monomial basis: img(j) = coefficients of T(t^j) (Example 3.2.6, May 2026 A8)
const LA_POLY_MAPS = [

// ---------- Sequences and series: limits, ε–n0, series (SS_) ----------
// Notation follows 4CCM115A notes §9–15: sequences s_n, limit ℓ, threshold n_0, N = {1,2,...}, log = natural log.
const SS_DIV = ['diverges', 'diverge', 'divergent', 'div', 'neither', 'none', 'dne', 'oscillates'];
const SS_HINT = 'a number, inf, -inf or diverges';
const SS_coef = c => c === 1 ? '' : c === -1 ? '-' : String(c);
const SS_pw = (v, p) => p === 0 ? '' : p === 1 ? v : `${v}^{${p}}`;
const SS_fracTerm = (c, den) => (c < 0 ? ' - ' : ' + ') + T`\frac{${Math.abs(c)}}{${den}}`;
// Like poly(), but a coefficient before a body that starts with a digit gets \cdot: 2\cdot 4^n, not 24^n
const SS_dotPoly = terms => poly(terms.map(([c, v]) => [c, /^\d/.test(v) && Math.abs(c) !== 1 ? T`\cdot ${v}` : v]));
const SS_poly3 = (c, v = 'n') => poly([[c[0], `${v}^2`], [c[1], v], [c[2], '']]);
const SS_ev = (c, n) => (c[0] * n + c[1]) * n + c[2];
// k^p for a positive rational p = frac object: k, \sqrt k or k^{p}
const SS_kpow = p => p.s === '1' ? 'k' : p.s === '1/2' ? T`\sqrt k` : T`k^{${p.tex}}`;

// Limit answer: a frac object {s, tex}, or 'inf' / '-inf' / 'div'
function SS_lim(r) {
  if (r === 'inf') return { a: INF_ALIASES, kind: 'text', show: T`\infty` };
  if (r === '-inf') return { a: INF_ALIASES.map(x => '-' + x), kind: 'text', show: T`-\infty` };
  if (r === 'div') return { a: SS_DIV, kind: 'text', show: T`\text{diverges}` };
  return { a: r.s, kind: 'num', show: r.tex };
}

// Ratio r = p/q in lowest terms (q <= 5, r != 1) -> { base: TeX to raise to a power, p, q }
function SS_geoTerm() {
  const q = ri(1, 5), p = nz(-6, 6);
  if (gcd(p, q) !== 1 || (p === 1 && q === 1)) return null;
  const base = q > 1 ? T`\left(${frac(p, q).tex}\right)` : p < 0 ? `(${p})` : String(p);
  return { base, p, q };
}
// lim r^n: 0 for |r| < 1, inf for r > 1, diverges for r <= -1
const SS_geoLim = g => Math.abs(g.p) < g.q ? frac(0, 1) : g.p > 0 ? 'inf' : 'div';

// Coefficients [n^2, n, 1] of a polynomial of exact degree d (d <= 2)
function SS_coefs(d) {
  const c = [ri(-5, 5), ri(-6, 6), ri(-9, 9)].map((x, i) => i < 2 - d ? 0 : x);
  c[2 - d] = nz(-6, 6);
  return c;
}
// lim (quadratic-or-less)/(quadratic-or-less): compare degrees (notes §10.1, §10.4)
function SS_ratPoly() {
  const db = ri(1, 2), dt = db === 2 ? pick([2, 2, 1, 0]) : pick([1, 1, 0, 2]);
  const top = SS_coefs(dt), bot = SS_coefs(db);
  if (bot.filter(x => x).length < 2) return null;   // a one-term denominator makes it trivial
  for (let n = 1; n <= 20; n++) if (SS_ev(bot, n) === 0) return null;
  const lt = top[2 - dt], lb = bot[2 - db];
  const r = dt < db ? frac(0, 1) : dt === db ? frac(lt, lb) : lt * lb > 0 ? 'inf' : '-inf', ans = SS_lim(r);
  return { q: T`$\displaystyle\lim_{n\to\infty} \frac{${SS_poly3(top)}}{${SS_poly3(bot)}}$`, ...ans,
           ...(ans.kind === 'num' && { val: SS_ev(top, 1e9) / SS_ev(bot, 1e9) }) };
}
// lim (a A^n + b B^n)/(c A^n + d B^n), A > B > 1: divide by A^n (notes §10.1 ex. 4)
function SS_ratExp() {
  const [A, B] = pick([[3, 2], [4, 3], [5, 2], [5, 3], [5, 4], [4, 2]]);
  const a = Math.random() < 0.15 ? 0 : nz(-5, 5), b = nz(-5, 5), c = Math.random() < 0.15 ? 0 : nz(-5, 5), d = nz(-5, 5);
  const den = n => c * A ** n + d * B ** n, ex = (x, y) => SS_dotPoly([[x, `${A}^n`], [y, `${B}^n`]]);
  if (a === 0 && c === 0) return null;
  for (let n = 1; n <= 12; n++) if (den(n) === 0) return null;
  const ans = SS_lim(c !== 0 ? frac(a, c) : a * d > 0 ? 'inf' : '-inf');
  return { q: T`$\displaystyle\lim_{n\to\infty} \frac{${ex(a, b)}}{${ex(c, d)}}$`, ...ans,
           ...(ans.kind === 'num' && { val: (a * A ** 200 + b * B ** 200) / den(200) }) };
}

// Converge / diverge to ±inf / diverge otherwise (notes §9.3–9.4): [TeX of s_n, limit code]
const SS_CONVDIV = [
  () => { const g = SS_geoTerm(); return g && [`${g.base}^n`, SS_geoLim(g)]; },
  () => { const c = nz(-4, 4), k = ri(1, 2); return [T`${SS_coef(c)}(-1)^n ${SS_pw('n', k)}`, 'div']; },
  () => { const c = nz(-5, 5), k = ri(1, 3); return [T`\frac{${SS_coef(c)}(-1)^n}{${SS_pw('n', k)}}`, frac(0, 1)]; },
  () => { const c = nz(-5, 5), k = ri(1, 3); return [poly([[c, SS_pw('n', k)]]), c > 0 ? 'inf' : '-inf']; },
  () => { const c = nz(-5, 5); return [poly([[c, T`\sqrt n`]]), c > 0 ? 'inf' : '-inf']; },
  () => { const c = nz(-5, 5); return [T`\frac{${c}}{\sqrt n}`, frac(0, 1)]; },
  () => { const c = nz(-5, 5); return [T`(-1)^n${SS_fracTerm(c, 'n')}`, 'div']; },
  () => { const c = nz(-5, 5), k = ri(1, 2); return [T`${c} + \frac{(-1)^n}{${SS_pw('n', k)}}`, frac(c, 1)]; },
  () => { const c = ri(1, 3); return [T`${SS_coef(c)}\left(1 + (-1)^n\right)n`, 'div']; },
];

// a^{1/n} -> 1 for a > 0 (notes §11.4); n^{1/n} -> 1 (Wilde's older notes, ex. 3.35): [TeX, s(n)]
function SS_rootTerm() {
  const a = ri(2, 20), u = Math.random();
  if (u < 0.2) return [T`n^{1/n}`, n => n ** (1 / n)];
  if (u < 0.4) return [T`\left(\frac{1}{${a}}\right)^{1/n}`, n => (1 / a) ** (1 / n)];
  return [T`${a}^{1/n}`, n => a ** (1 / n)];
}

// Smallest n >= 1 with test(n), for a test that stays true once true; guess = the real threshold
function SS_first(test, guess) {
  let n = Math.max(1, Math.floor(guess) - 2);
  while (!test(n)) n++;
  return n;
}
// ε as u/v: shown as a decimal or a fraction
const SS_epsTeX = (u, v) => Math.random() < 0.5 && String(u / v).length <= 6 ? String(u / v) : T`\frac{${u}}{${v}}`;
// n_0 for c/n^2, c/sqrt n or K/(n+d) below ε = u/v (integer arithmetic: exact at the boundary)
function SS_n0Draw() {
  const c = ri(2, 9), j = ri(3, 12), [u, v] = pick([[1, 10], [1, 20], [1, 50], [1, 4], [1, 5], [3, 10], [2, 5], [1, 25]]);
  return pick([
    () => { const [uu, vv] = Math.random() < 0.5 ? [1, c * j * j] : [u, v * pick([1, 10])];   // half the time c/ε is a perfect square
            return [T`\frac{${c}}{n^2}`, uu, vv, SS_first(n => uu * n * n > c * vv, Math.sqrt(c * vv / uu))]; },
    () => { const cc = ri(1, 5); return [T`\frac{${cc}}{\sqrt n}`, u, v, SS_first(n => u * u * n > cc * cc * v * v, (cc * v / u) ** 2)]; },
    () => { const K = ri(1, 9), d = ri(1, 6), vv = v * pick([1, 10]);
            return [T`\frac{${K}}{n + ${d}}`, u, vv, SS_first(n => u * (n + d) > K * vv, K * vv / u - d)]; },
  ])();
}

// Monotone? (notes §12): [TeX, s(n)]; classified numerically by SS_monotone

  let i = 0;
  const binary = (next, ops) => { let l = next(); while (ops.includes(toks[i])) { const op = toks[i++]; l = bin(op, l, next()); } return l; };
  const atom = () => {
    const t = toks[i++];
    if (t === '¬') return neg(atom());
    if (t === '(') { const f = top(); if (toks[i++] !== ')') throw 0; return f; }
    if (/^[PQRS][₀-₉\d]*$/.test(t)) return t;
    throw 0;
  };
  const mid = () => binary(atom, ['∧', '∨']), top = () => binary(mid, ['→', '↔']);
  const f = top();
  if (i !== toks.length) throw 0;
  return f;
}
function checkLogic(q, input) {

  if (q.nnf && !negOnLetters(f)) return false;
  return valid([f], g) && valid([g], f);
}

function check(q, input, strict = STRICT_STACK) {
  if (!input.trim()) return false;
  if (q.pattern && !q.pattern.test(input.replace(/\s+/g, '').toLowerCase())) return false;   // required answer shape
  try {
    if (q.kind === 'num' || q.kind === 'expr') return checkExpr(q, input, strict);
    if (q.kind === 'vec' || q.kind === 'mat') return checkGrid(q, input);
    if (q.kind === 'interval') return normSet(input) === normSet(q.a);
    if (q.kind === 'text') return [].concat(q.a).some(a => normText(a) === normText(input));
    if (q.kind === 'logic') return checkLogic(q, input);
    if (q.kind === 'syntax') return [].concat(q.a).some(a => normLogic(a) === normLogic(input));
    if (q.kind === 'set') return [].concat(q.a).some(a => normSetList(a) === normSetList(input));
  } catch (e) { /* incomplete input */ }

}

<script>
const RATINGS_KEY = 'drill-ratings-v1', PB_KEY = 'drill-pb-v1', HISTORY_KEY = 'drill-history-v1';
const RC = CONFIG.rating;
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const mean = xs => xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : RC.start;
const dayKey = (t = Date.now()) => new Date(t).toLocaleDateString('en-CA');
const loadJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));
const weekNow = cat => CONFIG.currentWeek[cat] ?? 0;
const weekLabel = () => Object.entries(CONFIG.currentWeek).filter(([c]) => c !== 'basics').map(([c, w]) => `${c} ${w}`).join(' · ');
const activeTypes = () => TYPES.filter(t => t.hub !== false && t.weight > 0 && t.week <= weekNow(t.cat) && CONFIG.categories[t.cat]?.weight > 0);
const DRILL_BY_ID = Object.fromEntries(CONFIG.drills.map(d => [d.id, d]));
// Focus drills are always fully available (practice ahead of lectures); only the main round follows currentWeek
const drillTypes = d => d.types.map(id => TYPE_BY_ID[id]).filter(t => t && t.weight > 0);
const pbKey = drill => drill ? `${PB_KEY}:${drill.id}` : PB_KEY;

// Speed vs the fixed par: 0.5 at par, 0.95 at about half par or faster, 0 at 1.5 × par or slower
const speedScore = (ms, par) => clamp(1.5 - ms / 1000 / par, 0, 0.95);
const expected = r => 1 / (1 + 10 ** ((RC.fluent - r) / 400));
// Correct: Elo step towards a score that is part correctness, part speed; floored at a small gain, capped.
// Skip / wrong tap: fixed worst loss.
function ratingDelta(r, ok, ms, par) {
  if (!ok) return -RC.missLoss;
  const e = expected(r), perf = 1 - RC.speedWeight + RC.speedWeight * speedScore(ms, par);
  return clamp(Math.max(RC.K * (perf - e), RC.slowFloor * (1 - e)), 0, RC.maxGain);
}
function decayed(st, now = Date.now()) {
  const idle = (now - st.last) / 864e5 - CONFIG.decay.afterDays;
  return st.r - clamp(CONFIG.decay.perDay * idle, 0, CONFIG.decay.maxLoss);

let RS = loadJSON(RATINGS_KEY, {});   // { typeId: { r, last, log: [{ d, ok, ms }], mastered } }
const ratingOf = id => RS[id] ? decayed(RS[id]) : RC.start;

const weakMult = cat => 1 + CONFIG.weakness.pointsBonus * weakness(catRating(cat));

}

function masteryStatus(log, par) {

  const met = n >= M.window && acc >= M.accuracy && med < par && days >= M.days;

}

    if (first) continue;

</script>

<script>

  vec: { mode: 'decimal', keys: ['-', ',', '/'] },

async function copySummary() {

function pbMessage(pts, pb) {
  if (!pb) return 'first scored round';
  if (pts > pb.points) return `<span class="up">new best, +${pts - pb.points}</span>`;
  if (pts === pb.points) return 'equal to your best';

}
const signed = d => `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}</span>`;
function ratingTable(st, round) {
  const rows = Object.keys(round.catR).filter(c => !st.drill || round.cats[c]).map(c =>
    `<tr><td>${CONFIG.categories[c].label}</td><td class="n">${round.catR[c]}</td><td class="n">${signed(round.catR[c] - (st.before[c] ?? RC.start))}</td></tr>`);
  const head = `<tr><td><b>Overall</b></td><td class="n"><b>${round.headline}</b></td><td class="n">${signed(round.headline - Math.round(st.beforeHead))}</td></tr>`;
  return `<h2>Rating</h2><table><tr><th>Category</th><th class="n">Rating</th><th class="n">This round</th></tr>${head}${rows.join('')}</table>`;
}
// Per-type rating change this round, largest first: category averages hide single-type progress
function movers(log) {
  const sum = {};
  log.forEach(e => { sum[e.type] = (sum[e.type] || 0) + e.delta; });
  const top = Object.entries(sum).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 6);
  if (!top.length) return '';
  return '<h2>Biggest moves</h2><table>' + top.map(([id, d]) =>
    `<tr><td>${TYPE_BY_ID[id].name}</td><td class="n">${Math.round(ratingOf(id))}</td><td class="n">${signed(Math.round(d))}</td></tr>`).join('') + '</table>';
}
function changeList(changes) {
  if (!changes.length) return '';
  return '<h2>Mastery</h2>' + changes.map(c => `<div class="miss">${c.change === 'mastered' ? '<span class="up">✓ Mastered</span>' : '<span class="down">✗ Lost mastery</span>'} · ${TYPE_BY_ID[c.id].name}</div>`).join('');
}
function summarise(log) {
  const cats = {};
  for (const e of log) {
    const c = cats[e.cat] || (cats[e.cat] = { n: 0, ok: 0, ms: 0 });
    c.n++;
    if (e.ok) { c.ok++; c.ms += e.ms; }
  }
  return cats;
}
const pct = c => Math.round(100 * c.ok / c.n);
const avgS = c => c.ok ? (c.ms / c.ok / 1000).toFixed(1) + ' s' : '–';

function catTable(cats) {
  const rows = Object.keys(CONFIG.categories).filter(k => cats[k]).map(k => {
    const c = cats[k];
    return `<tr><td>${CONFIG.categories[k].label}</td><td class="n">${c.ok}/${c.n}</td><td class="n">${pct(c)}%</td><td class="n">${avgS(c)}</td></tr>`;
  });
  return `<h2>This round</h2><table><tr><th>Category</th><th class="n">Correct</th><th class="n">Acc.</th><th class="n">Avg time</th></tr>${rows.join('')}</table>`;
}
// Weakest = lowest accuracy over the last 5 rounds (ties: slower first). Needs 3+ attempts.
function weakest(hist) {
  const agg = {};
  for (const r of hist.slice(-5)) for (const [k, c] of Object.entries(r.cats)) {
    const a = agg[k] || (agg[k] = { n: 0, ok: 0, ms: 0 });
    a.n += c.n; a.ok += c.ok; a.ms += c.ms;
  }
  return Object.entries(agg).filter(([k, c]) => c.n >= 3 && CONFIG.categories[k])
    .sort(([, a], [, b]) => a.ok / a.n - b.ok / b.n || b.ms / (b.ok || 1) - a.ms / (a.ok || 1)).slice(0, 2);
}
function weakBox(hist) {
  const w = weakest(hist);
  if (!w.length) return '';
  const items = w.map(([k, c]) => `<b>${CONFIG.categories[k].label}</b> ${pct(c)}%, ${avgS(c)}`).join('<br>');
  return `<div class="weak">Weakest (last ${Math.min(5, hist.length)} rounds):<br>${items}<div class="muted">Raise their weights in CONFIG.</div></div>`;
}
function sparkline(values, fmt, W = 140) {
  const H = 30, n = values.length, x = i => n > 1 ? 4 + i * (W - 8) / (n - 1) : W / 2, y = v => H - 3 - v * (H - 6);
  const pts = values.map((v, i) => [x(i), y(v.y)]);
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const dots = pts.map((p, i) => `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3"><title>${fmt(values[i])}</title></circle>`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><line class="base" x1="0" x2="${W}" y1="${H - 3}" y2="${H - 3}"/>${n > 1 ? `<path class="ln" d="${path}"/>` : ''}${dots}</svg>`;
}
const shortDate = t => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const ratingY = r => clamp((r - RC.start + 200) / (RC.fluent - RC.start + 900), 0, 1);
function trendBlock(hist) {
  if (!hist.length) return '';
  const recent = hist.slice(-20), scored = recent.filter(r => r.points !== undefined);
  const best = Math.max(...scored.map(r => r.points), 1);
  const scoreRow = scored.length ? `<tr><td>Points</td><td>${sparkline(scored.map(r => ({ y: Math.max(r.points, 0) / best, r })), v => `${shortDate(v.r.t)}: ${v.r.points}`)}</td><td class="n">${scored.at(-1).points}</td></tr>` : '';
  const rows = Object.keys(CONFIG.categories).map(k => {
    const pts = recent.filter(r => r.cats[k]?.n).map(r => ({ y: r.cats[k].ok / r.cats[k].n, r, c: r.cats[k] }));
    if (!pts.length) return '';
    return `<tr><td>${CONFIG.categories[k].label}</td><td>${sparkline(pts, v => `${shortDate(v.r.t)}: ${pct(v.c)}%, ${avgS(v.c)}`)}</td><td class="n">${pct(pts.at(-1).c)}%</td></tr>`;
  });

}
// Misses and the unfinished last question, with your attempt next to the answer (skips the one shown at 0 s)
function reviewList(log) {
  const items = log.filter(e => !e.ok && !(e.unanswered && e.ms < 2000 && !e.attempt));
  if (!items.length) return '';
  return '<h2>Review</h2>' + items.map(e => {
    const status = e.unanswered ? 'unfinished' : e.skipped ? 'skipped' : 'wrong';
    const you = e.attempt ? `<code class="down">${esc(e.attempt)}</code>` : '<span class="muted">nothing typed</span>';
    return `<div class="miss">${renderMath(e.q)}<div class="muted">${status} · you: ${you} · answer: ${renderMath(`$${e.ans}$`)}</div></div>`;
