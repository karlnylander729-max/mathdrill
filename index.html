<!-- ============================== CONFIG ==============================
  Weekly edit:
    - Retire a pool: set its weight to 0.
    - Reweight: change a category weight or a type weight.
    - Unlock future pools: raise currentWeek. Types with week > currentWeek stay off.
    - Add a pool: copy a type line, give it a new id, edit gen().
  gen() returns null to reject a degenerate draw (the engine redraws), or:
    { q: 'prompt, TeX between $…$', a: canonical answer, kind, ...options }
  kinds: num | expr (checked by evaluation) · vec | mat (a = numbers) ·
         interval · text (a = string or list) · logic (formula, checked by truth table) ·
         bool (a = true/false, labels = [trueLabel, falseLabel]) ·
         syntax (exact L1 string; ASCII -> & v ~ accepted)
  options: show (TeX for the answer), mode (keyboard: text | decimal | none), dom [lo,hi] for real variables,
           parallel (vec: any nonzero multiple), unordered (vec as a set), keys (symbol row)
======================================================================= -->
<script>
const CONFIG = {
  roundSeconds: 120,
  currentWeek: 4,
  categories: {
    la:    { label: 'Linear algebra',       weight: 1 },
    calc:  { label: 'Calculus',             weight: 1 },
    seq:   { label: 'Sequences & series',   weight: 1 },
    logic: { label: 'Elementary logic',     weight: 1 },
  },
};

const TYPES = [
  // ---------- Linear algebra ----------
  { id: 'la-dot', cat: 'la', week: 1, weight: 1, gen() {
    const n = pick([2, 3]), u = vec(n, -5, 5), v = vec(n, -5, 5);
    if (isZero(u) || isZero(v)) return null;
    return { q: T`$${colv(u)}\cdot${colv(v)}$`, a: String(dot(u, v)), kind: 'num' };
  }},
  { id: 'la-normsq', cat: 'la', week: 1, weight: 1, gen() {
    const v = vec(3, -6, 6);
    if (isZero(v)) return null;
    return { q: T`$\lVert ${colv(v)} \rVert^2$`, a: String(dot(v, v)), kind: 'num' };
  }},
  { id: 'la-norm', cat: 'la', week: 1, weight: 1, gen() {
    const [v, len] = pythagorean();
    return { q: T`$\lVert ${colv(v)} \rVert$`, a: String(len), kind: 'num', val: Math.hypot(...v) };
  }},
  { id: 'la-lincomb', cat: 'la', week: 1, weight: 1, gen() {
    const a = nz(-4, 4), b = nz(-4, 4), u = vec(3, -5, 5), v = vec(3, -5, 5);
    const w = u.map((x, i) => a * x + b * v[i]);
    return { q: T`$${poly([[a, T`\mathbf u`], [b, T`\mathbf v`]])}$, $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)}$`,
             a: w, kind: 'vec', show: colv(w) };
  }},
  { id: 'la-distsq', cat: 'la', week: 1, weight: 1, gen() {
    const n = pick([2, 3]), u = vec(n, -5, 5), v = vec(n, -5, 5);
    const d = u.map((x, i) => x - v[i]);
    if (isZero(d)) return null;
    return { q: T`$\lVert \mathbf u - \mathbf v \rVert^2$, $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)}$`, a: String(dot(d, d)), kind: 'num' };
  }},
  { id: 'la-orth', cat: 'la', week: 1, weight: 1, gen() {
    const u = vec(3, -4, 4), w = vec(3, -2, 2);
    const v = Math.random() < 0.5 ? cross(u, w) : vec(3, -5, 5);
    if (isZero(u) || isZero(v) || v.some(x => Math.abs(x) > 9)) return null;
    return { q: T`Orthogonal? $\ ${colv(u)},\ ${colv(v)}$`, a: dot(u, v) === 0, kind: 'bool', labels: ['Yes', 'No'] };
  }},
  { id: 'la-alpha', cat: 'la', week: 1, weight: 1, gen() {
    const alpha = nz(-3, 3), v = vec(3, -3, 3), w = vec(3, -3, 3), u = vec(3, -4, 4);
    const i = w.findIndex(x => Math.abs(x) === 1);
    if (i < 0 || dot(v, w) === 0) return null;
    u[i] = 0;
    u[i] = (-alpha * dot(v, w) - dot(u, w)) / w[i];
    if (Math.abs(u[i]) > 9) return null;
    return { q: T`$\alpha$ with $(\mathbf u + \alpha\mathbf v)\perp\mathbf w$: $\ \mathbf u = ${colv(u)},\ \mathbf v = ${colv(v)},\ \mathbf w = ${colv(w)}$`,
             a: String(alpha), kind: 'num' };
  }},
  { id: 'la-direction', cat: 'la', week: 1, weight: 1, gen() {
    const p = vec(3, -5, 5), r = vec(3, -5, 5), d = r.map((x, i) => x - p[i]);
    if (isZero(d)) return null;
    return { q: T`A direction vector of the line through $${colv(p)}$ and $${colv(r)}$`,
             a: d, kind: 'vec', parallel: true, show: colv(d) };
  }},
  { id: 'la-plane-d', cat: 'la', week: 1, weight: 1, gen() {
    const n = vec(3, -4, 4), p = vec(3, -4, 4);
    if (isZero(n)) return null;
    return { q: T`Plane through $${colv(p)}$ with normal $${colv(n)}$: $\ ${poly([[n[0], 'x'], [n[1], 'y'], [n[2], 'z']])} = d$. $\ d = ?$`,
             a: String(dot(n, p)), kind: 'num' };
  }},
  { id: 'la-size', cat: 'la', week: 2, weight: 1, gen() {
    const { A, B, tex, X, Y } = balanced(() => {
      const A = [ri(1, 4), ri(1, 4)], B = [ri(1, 4), ri(1, 4)];
      const [tex, X, Y] = pick([['AB', A, B], ['BA', B, A], ['A^TB', tr(A), B], ['AB^T', A, tr(B)], ['B^TA^T', tr(B), tr(A)]]);
      return { A, B, tex, X, Y };
    }, d => d.X[1] === d.Y[0]);
    const ok = X[1] === Y[0];
    return { q: T`$A$ is $${A[0]}\times${A[1]}$, $B$ is $${B[0]}\times${B[1]}$. Size of $${tex}$?`,
             a: ok ? `${X[0]}x${Y[1]}` : 'undefined', kind: 'text', keys: ['×', 'undefined'] };
  }},
  { id: 'la-entry', cat: 'la', week: 2, weight: 1, gen() {
    const m = pick([2, 3]), A = mat(2, m, -3, 3), B = mat(m, 2, -3, 3), i = ri(1, 2), j = ri(1, 2);
    const v = A[i - 1].reduce((s, x, k) => s + x * B[k][j - 1], 0);
    return { q: T`$(AB)_{${i}${j}}$, $\ A = ${matTeX(A)},\ B = ${matTeX(B)}$`, a: String(v), kind: 'num' };
  }},
  { id: 'la-Av', cat: 'la', week: 2, weight: 1, gen() {
    const n = pick([2, 3]), A = mat(2, n, -3, 3), v = vec(n, -3, 3);
    const w = A.map(r => dot(r, v));
    return { q: T`$${matTeX(A)}${colv(v)}$`, a: w, kind: 'vec', show: colv(w) };
  }},
  { id: 'la-product', cat: 'la', week: 2, weight: 1, gen() {
    const A = mat(2, 2, -3, 3), B = mat(2, 2, -3, 3);
    const C = A.map(r => [0, 1].map(j => r[0] * B[0][j] + r[1] * B[1][j]));
    return { q: T`$${matTeX(A)}${matTeX(B)}$`, a: C, kind: 'mat', show: matTeX(C) };
  }},
  { id: 'la-rowop', cat: 'la', week: 2, weight: 1, gen() {
    const r1 = [1, ri(-4, 4), ri(-5, 5)], r2 = vec(3, -5, 5), c = nz(-3, 3);
    const out = r2.map((x, k) => x - c * r1[k]);
    return { q: T`$${matTeX([r1, r2])}$, $\ R_2 \to ${poly([[1, 'R_2'], [-c, 'R_1']])}$. New $R_2$?`,
             a: out, kind: 'vec', show: matTeX([out]) };
  }},
  { id: 'la-det2', cat: 'la', week: 6, weight: 1, gen() {
    const A = mat(2, 2, -6, 6), d = A[0][0] * A[1][1] - A[0][1] * A[1][0];
    if (d === 0) return null;
    return { q: T`$\det${matTeX(A)}$`, a: String(d), kind: 'num' };
  }},
  { id: 'la-eig2', cat: 'la', week: 9, weight: 1, gen() {
    const l1 = ri(-5, 5), l2 = ri(-5, 5), a = ri(-5, 5), d = l1 + l2 - a, bc = a * d - l1 * l2;
    if (l1 === l2 || bc === 0) return null;
    const b = pick(divisors(bc)), c = bc / b;
    return { q: T`Eigenvalues of $${matTeX([[a, b], [c, d]])}$ (comma-separated)`,
             a: [l1, l2], kind: 'vec', unordered: true, show: `${l1},\\ ${l2}` };
  }},

  // ---------- Calculus I ----------
  { id: 'calc-trig', cat: 'calc', week: 1, weight: 1, gen() {
    const m = pick(STD_ANGLES), f = pick(['sin', 'cos', 'tan']), v = Math[f](m * Math.PI / 12);
    if (f === 'tan' && Math.abs(Math.cos(m * Math.PI / 12)) < 1e-9) return null;
    const ex = exact(v);
    return { q: T`$${'\\' + f}\left(${piFrac(m, 12).tex}\right)$`, a: ex.s, show: ex.tex, kind: 'num', val: v };
  }},
  { id: 'calc-arc', cat: 'calc', week: 1, weight: 1, gen() {
    const f = pick(['asin', 'acos', 'atan']);
    const x = pick(f === 'atan' ? TAN_VALUES : SIN_VALUES) * pick([1, -1]);
    const r = Math[f](x), p = piFrac(Math.round(r * 12 / Math.PI), 12);
    return { q: T`$\arc${f.slice(1)}\left(${exact(x).tex}\right)$`, a: p.s, show: p.tex, kind: 'num', val: r };
  }},
  { id: 'calc-arc-branch', cat: 'calc', week: 1, weight: 1, gen() {
    const [inv, f] = pick([['asin', 'sin'], ['acos', 'cos'], ['atan', 'tan']]), m = ri(-11, 12), th = m * Math.PI / 6;
    if (f === 'tan' && Math.abs(Math.cos(th)) < 1e-9) return null;
    const r = Math[inv](Math[f](th)), p = piFrac(Math.round(r * 6 / Math.PI), 6);
    if (Math.abs(r - th) < 1e-9 && Math.random() < 0.7) return null;
    return { q: T`$\arc${f}\left(${'\\' + f}\left(${piFrac(m, 6).tex}\right)\right)$`, a: p.s, show: p.tex, kind: 'num', val: r };
  }},
  { id: 'calc-log', cat: 'calc', week: 1, weight: 1, gen() {
    const c = pick([2, 3, 5]), p = ri(1, 3), q = nz(-3, 6), b = c ** p, x = c ** Math.abs(q);
    if (c ** (p * 6) > 1e6 || x > 1000) return null;
    const arg = q > 0 ? String(x) : T`\frac{1}{${x}}`, f = frac(q, p);
    return { q: T`$\log_{${b}} ${arg}$`, a: f.s, show: f.tex, kind: 'num', val: q * Math.log(c) / Math.log(b) };
  }},
  { id: 'calc-ln', cat: 'calc', week: 1, weight: 1, gen() {
    const k = nz(-4, 6), r = pick([1, 2, 3]), f = frac(k, r);
    const inner = r === 1 ? T`e^{${k}}` : T`\sqrt${r === 2 ? '' : '[3]'}{e^{${k}}}`;
    return { q: T`$\ln ${inner}$`, a: f.s, show: f.tex, kind: 'num', val: k / r };
  }},
  { id: 'calc-loglaw', cat: 'calc', week: 1, weight: 1, gen() {
    const b = pick([2, 3, 5]), n = pick([2, 3, 5, 6, 7].filter(x => x !== b)), k = ri(1, 3);
    return { q: T`$\log_{${b}} ${n * b ** k} - \log_{${b}} ${n}$`, a: String(k), kind: 'num' };
  }},
  { id: 'calc-exp', cat: 'calc', week: 1, weight: 1, gen() {
    const r = pick([2, 3, 4, 5]), q = pick([2, 3]), p = nz(-3, 3), base = r ** q;
    if (base > 125 || gcd(p, q) !== 1) return null;
    const f = p > 0 ? frac(r ** p, 1) : frac(1, r ** -p);
    return { q: T`$${base}^{${frac(p, q).tex}}$`, a: f.s, show: f.tex, kind: 'num', val: base ** (p / q) };
  }},
  { id: 'calc-inverse', cat: 'calc', week: 1, weight: 1, gen() {
    const a = nz(-6, 6), b = nz(-6, 6), c = ri(1, 5);
    return pick([
      { q: T`$f(x) = ${poly([[a, 'x'], [b, '']])}$. $\ f^{-1}(x) = ?$`, a: `(x - (${b}))/(${a})`, kind: 'expr' },
      { q: T`$f(x) = x^3 + ${c}$. $\ f^{-1}(x) = ?$`, a: `cbrt(x - ${c})`, kind: 'expr', dom: [c + 0.5, c + 8] },
      { q: T`$f(x) = e^{${poly([[a, 'x']])}} + ${c}$. $\ f^{-1}(x) = ?$`, a: `ln(x - ${c})/(${a})`, kind: 'expr', dom: [c + 0.5, c + 8] },
      { q: T`$f(x) = \dfrac{${a}}{x ${b < 0 ? '+' : '-'} ${Math.abs(b)}}$. $\ f^{-1}(x) = ?$`, a: `${b} + ${a}/x`, kind: 'expr' },
    ]);
  }},
  { id: 'calc-compose', cat: 'calc', week: 3, weight: 1, gen() {
    const f = pick(OUTER), g = pick(INNER);
    if (f.tex === g.tex) return null;
    const [first, second, name] = Math.random() < 0.5 ? [f, g, 'f(g(x))'] : [g, f, 'g(f(x))'];
    return { q: T`$f(x) = ${f.tex.replaceAll('u', 'x')},\ g(x) = ${g.tex.replaceAll('u', 'x')}$. $\ ${name} = ?$`,
             a: first.s.replaceAll('u', `(${second.s.replaceAll('u', 'x')})`), kind: 'expr' };
  }},
  { id: 'calc-cx-mul', cat: 'calc', week: 2, weight: 1, gen() {
    const [a, b, c, d] = [nz(-4, 4), nz(-4, 4), nz(-4, 4), nz(-4, 4)];
    return { q: T`$(${cx(a, b)})(${cx(c, d)})$`, a: cx(a * c - b * d, a * d + b * c), kind: 'num', keys: CX_KEYS };
  }},
  { id: 'calc-cx-mod', cat: 'calc', week: 2, weight: 1, gen() {
    const [[x, y], r] = pick([[[3, 4], 5], [[5, 12], 13], [[8, 15], 17], [[6, 8], 10], [[7, 24], 25]]);
    const [a, b] = (Math.random() < 0.5 ? [x, y] : [y, x]).map(t => t * pick([1, -1]));
    return { q: T`$\lvert ${cx(a, b)} \rvert$`, a: String(r), kind: 'num' };
  }},
  { id: 'calc-cx-arg', cat: 'calc', week: 2, weight: 1, gen() {
    const m = pick(STD_ANGLES.filter(t => t > -12 && t <= 12)), th = m * Math.PI / 12, k = ri(1, 3);
    const [re, im] = argPoint(m, k), p = piFrac(m, 12);
    return { q: T`Principal $\operatorname{Arg}(${cxTeX(re, im)})$`, a: p.s, show: p.tex, kind: 'num',
             val: Math.atan2(im.v, re.v), check: Math.abs(Math.atan2(im.v, re.v) - th) < 1e-9 };
  }},
  { id: 'calc-hyp', cat: 'calc', week: 3, weight: 1, gen() {
    const a = pick([2, 3, 4, 5]), s = pick([1, -1]), f = pick(['sinh', 'cosh', 'tanh']);
    const num = { sinh: s * (a * a - 1), cosh: a * a + 1, tanh: s * (a * a - 1) }[f];
    const ans = frac(num, f === 'tanh' ? a * a + 1 : 2 * a);
    const arg = s > 0 ? T`\ln ${a}` : T`\ln\frac{1}{${a}}`;
    return { q: T`$${'\\' + f}(${arg})$`, a: ans.s, show: ans.tex, kind: 'num', val: Math[f](s * Math.log(a)) };
  }},
  { id: 'calc-series', cat: 'calc', week: 1, weight: 1, gen() {
    const [tex, coef] = pick(SERIES)(), n = ri(0, 6), c = coef(n);
    if (c[0] === 0 && Math.random() < 0.7) return null;
    const f = frac(c[0], c[1]);
    return { q: T`Coefficient of $x^{${n}}$ in the power series of $${tex}$`, a: f.s, show: f.tex, kind: 'num' };
  }},
  { id: 'calc-lim-std', cat: 'calc', week: 4, weight: 1, gen() {
    const a = ri(1, 9), b = ri(1, 9);
    if (a === b) return null;
    const [tex, ans, fn] = pick([
      [T`\frac{\sin ${a}x}{${b}x}`, frac(a, b), x => Math.sin(a * x) / (b * x)],
      [T`\frac{\tan ${a}x}{${b}x}`, frac(a, b), x => Math.tan(a * x) / (b * x)],
      [T`\frac{\sin ${a}x}{\sin ${b}x}`, frac(a, b), x => Math.sin(a * x) / Math.sin(b * x)],
      [T`\frac{\arcsin ${a}x}{${b}x}`, frac(a, b), x => Math.asin(a * x) / (b * x)],
      [T`\frac{1 - \cos ${a}x}{${b}x^2}`, frac(a * a, 2 * b), x => (1 - Math.cos(a * x)) / (b * x * x)],
    ]);
    return { q: T`$\displaystyle\lim_{x\to 0} ${tex.replace(/(\D)1x/g, '$1x')}$`, a: ans.s, show: ans.tex, kind: 'num', val: fn(1e-4) };
  }},
  { id: 'calc-lim-inf', cat: 'calc', week: 4, weight: 1, gen() {
    const top = [nz(-6, 6), ri(-5, 5), ri(-9, 9)], bot = [nz(-6, 6), ri(-5, 5), ri(-9, 9)];
    if (Math.random() < 0.25) top[0] = 0;
    const p = c => poly([[c[0], 'x^2'], [c[1], 'x'], [c[2], '']]), f = frac(top[0], bot[0]);
    const h = (c, x) => c[0] * x * x + c[1] * x + c[2];
    if (top.every(c => c === 0)) return null;
    return { q: T`$\displaystyle\lim_{x\to\infty} \frac{${p(top)}}{${p(bot)}}$`, a: f.s, show: f.tex, kind: 'num', val: h(top, 1e7) / h(bot, 1e7) };
  }},
  { id: 'calc-piecewise', cat: 'calc', week: 4, weight: 1, gen() {
    const c = pick([-2, -1, 1, 2, 3]), k = ri(-5, 5), p = nz(-4, 4), q = ri(-5, 5), r = p * c * c + q - k * c;
    return { q: T`$f(x) = \begin{cases} ${poly([[p, 'x^2'], [q, '']])} & x < ${c} \\ ${poly([[1, 'k x'], [r, '']])} & x \ge ${c} \end{cases}$ is continuous. $\ k = ?$`,
             a: String(k), kind: 'num' };
  }},
  { id: 'calc-deriv', cat: 'calc', week: 6, weight: 1, gen() {
    const a = nz(-6, 6), n = ri(2, 5), b = nz(-6, 6), m = ri(0, n - 1);
    return { q: T`$\frac{d}{dx}\left(${poly([[a, `x^{${n}}`], [b, m ? `x^{${m}}` : '']])}\right)$`,
             a: `${a * n}x^${n - 1} + ${b * m}x^${Math.max(m - 1, 0)}`, kind: 'expr' };
  }},

  // ---------- Sequences and Series ----------
  { id: 'seq-terms', cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(-3, 8), b = a + ri(0, 15), body = pick(['k^2', '2k+1', '\\frac1k', '(-1)^k', '3^k']);
    if (body === '\\frac1k' && a <= 0 && b >= 0) return null;
    return { q: T`Number of terms in $\displaystyle\sum_{k=${a}}^{${b}} ${body}$`, a: String(b - a + 1), kind: 'num' };
  }},
  { id: 'seq-const', cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(-2, 5), b = a + ri(1, 10), c = nz(-9, 9);
    return { q: T`$\displaystyle\sum_{k=${a}}^{${b}} ${c}$`, a: String(c * (b - a + 1)), kind: 'num' };
  }},
  { id: 'seq-const-n', cat: 'seq', week: 1, weight: 1, gen() {
    const [tex, s] = pick([['n', 'n'], ['2n', '2n'], ['n+1', '(n+1)'], ['n^2', 'n^2'], ['3', '3'], ['n-1', '(n-1)']]);
    const j = pick(['j', 'k', 'i']);
    return { q: T`$\displaystyle\sum_{${j}=1}^{n} ${tex}$ (in terms of $n$)`, a: `n*${s}`, kind: 'expr', keys: N_KEYS };
  }},
  { id: 'seq-linsum', cat: 'seq', week: 1, weight: 1, gen() {
    const a = ri(0, 3), b = ri(a + 2, 9), c = ri(1, 5), d = ri(-5, 5);
    let s = 0;
    for (let k = a; k <= b; k++) s += c * k + d;
    return { q: T`$\displaystyle\sum_{k=${a}}^{${b}} (${poly([[c, 'k'], [d, '']])})$`, a: String(s), kind: 'num' };
  }},
  { id: 'seq-geosum', cat: 'seq', week: 1, weight: 1, gen() {
    const [p, q] = pick([[2, 1], [3, 1], [-2, 1], [1, 2], [-1, 2]]), lo = ri(0, 1), hi = ri(3, p === 3 ? 4 : 6);
    let num = 0;
    for (let k = lo; k <= hi; k++) num += p ** k * q ** (hi - k);
    const f = frac(num, q ** hi), r = frac(p, q);
    return { q: T`$\displaystyle\sum_{k=${lo}}^{${hi}} ${q === 1 && p > 0 ? p : T`\left(${r.tex}\right)`}^k$`, a: f.s, show: f.tex, kind: 'num' };
  }},
  { id: 'seq-closed', cat: 'seq', week: 1, weight: 1, gen() {
    const c = ri(1, 6), d = ri(-5, 5);
    return { q: T`$\displaystyle\sum_{k=1}^{n} (${poly([[c, 'k'], [d, '']])})$ (in terms of $n$)`,
             a: `${c}*n(n+1)/2 + ${d}*n`, kind: 'expr', keys: N_KEYS };
  }},
  { id: 'seq-floor', cat: 'seq', week: 1, weight: 1, gen() {
    const x = pick([1, -1]) * (ri(0, 9) + ri(1, 9) / 10), f = pick(['floor', 'ceil']);
    const tex = f === 'floor' ? T`\lfloor ${x} \rfloor` : T`\lceil ${x} \rceil`;
    return { q: T`$${tex}$`, a: String(Math[f](x)), kind: 'num' };
  }},
  { id: 'seq-subsets', cat: 'seq', week: 1, weight: 1, gen() {
    const items = Array.from({ length: ri(0, 6) }, () => ri(1, 9)), n = new Set(items).size;
    return { q: T`Number of subsets of $\{${items.join(', ')}\}$`, a: String(2 ** n), kind: 'num' };
  }},
  { id: 'seq-count', cat: 'seq', week: 1, weight: 1, gen() {
    const D = pick(['N', 'Z']), a = ri(-6, 4), b = a + ri(1, 10), lo = pick(['<', '\\le']), hi = pick(['<', '\\le']);
    let n = 0;
    for (let x = a; x <= b; x++) {

      if (inLo && inHi && (D === 'Z' || x >= 1)) n++;

    return { q: T`$\lvert\{x\in\mathbb ${D} : ${a} ${lo} x ${hi} ${b}\}\rvert$`, a: String(n), kind: 'num' };
  }},
  { id: 'seq-interval', cat: 'seq', week: 1, weight: 1, gen() {
    const I = randInterval(), J = randInterval(), op = pick(['cap', 'cup']);
    const res = op === 'cap' ? intersect(I, J) : union(I, J);
    if (!res) return null;
    return { q: T`$${ivTeX(I)} ${'\\' + op} ${ivTeX(J)}$`, a: res, kind: 'interval', show: setTeX(res) };
  }},
  { id: 'seq-modulus', cat: 'seq', week: 3, weight: 1, gen() {
    const a = ri(-9, 9), r = ri(1, 9), rel = pick(['<', '\\le', '>', '\\ge']), closed = rel.includes('le') || rel.includes('ge');
    const [L, R] = closed ? ['[', ']'] : ['(', ')'];
    const res = rel === '<' || rel === '\\le' ? `${L}${a - r},${a + r}${R}` : `(-inf,${a - r}${R} U ${L}${a + r},inf)`;
    return { q: T`$\{x\in\mathbb R : \lvert ${poly([[1, 'x'], [-a, '']])} \rvert ${rel} ${r}\}$`, a: res, kind: 'interval', show: setTeX(res) };

  { id: 'seq-quant', cat: 'seq', week: 2, weight: 1, gen() {

  { id: 'seq-injective', cat: 'seq', week: 2, weight: 1, gen() {
    const a = ri(-5, 4), b = ri(a + 1, 5), f = pick(['x^2', '\\lvert x\\rvert']), k = ri(-3, 3), c = k - ri(0, 2);
    return pick([
      { q: T`$f:[${a},${b}]\to\mathbb R,\ f(x) = ${f}$. Injective?`, a: a >= 0 || b <= 0, kind: 'bool', labels: ['Yes', 'No'] },
      { q: T`$f:\mathbb R\to[${c},\infty),\ f(x) = ${poly([[1, 'x^2'], [k, '']])}$. Surjective?`, a: c === k, kind: 'bool', labels: ['Yes', 'No'] },
    ]);
  }},

  // ---------- Elementary Logic ----------
  { id: 'logic-famous', cat: 'logic', week: 1, weight: 1, gen() {
    const form = pick(FAMOUS), [A, B, C] = literals(3), [prem, conc] = form.f(A, B, C);
    return { q: argText(shuffle(prem), conc), a: valid(prem, conc), kind: 'bool', labels: ['Valid', 'Invalid'] };
  }},
  { id: 'logic-main', cat: 'logic', week: 3, weight: 1, gen() {
    const f = rf(3, ['P', 'Q', 'R']);
    if (typeof f === 'string' || depth(f) < 2) return null;
    return { q: `Main connective of <span class="f">${show(f)}</span>`, a: CONNECTIVE_ALIASES[f.op], show: f.op, kind: 'text', keys: ['¬', '∧', '∨', '→', '↔'], noKeyboard: true };

<script>
const T = String.raw;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const nz = (a, b) => { let v; do v = ri(a, b); while (v === 0); return v; };
const vec = (n, a, b) => Array.from({ length: n }, () => ri(a, b));
const mat = (m, n, a, b) => Array.from({ length: m }, () => vec(n, a, b));
// Redraw make() until key() matches a fair coin, so yes/no answers come out about 50/50
function balanced(make, key) {
  const want = Math.random() < 0.5;
  for (let i = 0; i < 200; i++) { const x = make(); if (x != null && key(x) === want) return x; }
  return null;
}
const isZero = v => v.every(x => x === 0);
const dot = (u, v) => u.reduce((s, x, i) => s + x * v[i], 0);
const cross = (u, v) => [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
const tr = ([m, n]) => [n, m];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const shuffle = arr => arr.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);
const colv = v => T`\begin{pmatrix}${v.join('\\\\')}\end{pmatrix}`;
const matTeX = M => T`\begin{pmatrix}${M.map(r => r.join('&')).join('\\\\')}\end{pmatrix}`;
const divisors = n => { const out = []; for (let d = 1; d <= Math.abs(n); d++) if (n % d === 0) out.push(d, -d); return out; };

// Reduced fraction p/q -> { s: 'p/q', tex }
function frac(p, q) {
  if (q < 0) { p = -p; q = -q; }
  const g = gcd(p, q) || 1;
  p /= g; q /= g;
  if (q === 1) return { s: String(p), tex: String(p) };
  return { s: `${p}/${q}`, tex: (p < 0 ? '-' : '') + T`\frac{${Math.abs(p)}}{${q}}` };
}

// m*pi/d -> { s: '2pi/3', tex: '\frac{2\pi}{3}' }
function piFrac(m, d) {
  const g = gcd(m, d) || 1, p = m / g, q = d / g;
  if (p === 0) return { s: '0', tex: '0' };
  const c = Math.abs(p) === 1 ? '' : Math.abs(p), sign = p < 0 ? '-' : '';
  if (q === 1) return { s: `${sign}${c}pi`, tex: T`${sign}${c}\pi` };
  return { s: `${sign}${c}pi/${q}`, tex: T`${sign}\frac{${c}\pi}{${q}}` };
}

// [[coef, 'x^2'], [coef, '']] -> '3x^2 - x + 2'
function poly(terms) {
  let out = '';
  for (const [c, v] of terms) {
    if (c === 0) continue;
    const mag = Math.abs(c) === 1 && v ? '' : Math.abs(c);
    out += (c < 0 ? (out ? ' - ' : '-') : (out ? ' + ' : '')) + mag + v;
  }
  return out || '0';
}

const STD_ANGLES = Array.from({ length: 49 }, (_, i) => i - 24).filter(m => m % 2 === 0 || m % 3 === 0);
const SIN_VALUES = [0, 1 / 2, Math.SQRT1_2, Math.sqrt(3) / 2, 1];
const TAN_VALUES = [0, 1 / Math.sqrt(3), 1, Math.sqrt(3)];
const EXACT = [['0', '0', 0], ['1/2', T`\frac{1}{2}`, 0.5], ['sqrt(2)/2', T`\frac{\sqrt2}{2}`, Math.SQRT1_2],
  ['sqrt(3)/2', T`\frac{\sqrt3}{2}`, Math.sqrt(3) / 2], ['1', '1', 1], ['sqrt(3)/3', T`\frac{\sqrt3}{3}`, 1 / Math.sqrt(3)],
  ['sqrt(3)', T`\sqrt3`, Math.sqrt(3)]];
function exact(v) {
  const [s, tex] = EXACT.find(e => Math.abs(Math.abs(v) - e[2]) < 1e-9);
  return v < -1e-12 ? { s: '-' + s, tex: '-' + tex } : { s, tex };
}

function pythagorean() {
  const [base, len] = pick([[[3, 4], 5], [[2, 3, 6], 7], [[1, 2, 2], 3], [[2, 6, 9], 11], [[4, 4, 7], 9], [[1, 4, 8], 9], [[6, 6, 7], 11], [[2, 10, 11], 15], [[5, 12], 13]]);
  return [shuffle(base).map(x => x * pick([1, -1])), len];
}

const cx = (a, b) => {
  if (b === 0) return String(a);
  const im = Math.abs(b) === 1 ? 'i' : `${Math.abs(b)}i`;
  if (a === 0) return (b < 0 ? '-' : '') + im;
  return `${a}${b < 0 ? '-' : '+'}${im}`;
};
const CX_KEYS = ['i', '+', '-', '(', ')'];
const N_KEYS = ['n', '^', '*', '/', '(', ')', '+', '-'];

// Point at angle m*pi/12 with scale k, exact coordinates as { tex, v }
function argPoint(m, k) {
  const c = Math.cos(m * Math.PI / 12), s = Math.sin(m * Math.PI / 12);
  const part = x => {
    const a = Math.abs(x);
    if (a < 1e-9) return { tex: '0', v: 0 };
    const sg = x < 0 ? -1 : 1;
    if (Math.abs(a - 1) < 1e-9) return { tex: String(sg * 2 * k), v: sg * 2 * k };
    if (Math.abs(a - 0.5) < 1e-9) return { tex: String(sg * k), v: sg * k };
    if (Math.abs(a - Math.SQRT1_2) < 1e-9) return { tex: String(sg * k), v: sg * k };
    return { tex: (sg < 0 ? '-' : '') + (k > 1 ? k : '') + T`\sqrt3`, v: sg * k * Math.sqrt(3) };
  };
  return [part(c), part(s)];
}
function cxTeX(re, im) {
  if (im.v === 0) return re.tex;
  const imAbs = im.tex.replace('-', ''), imPart = (imAbs === '1' ? '' : imAbs) + 'i';
  if (re.v === 0) return (im.v < 0 ? '-' : '') + imPart;
  return `${re.tex} ${im.v < 0 ? '-' : '+'} ${imPart}`;
}

// Composition building blocks: u is the slot
const OUTER = [{ tex: 'u^2', s: 'u^2' }, { tex: 'u^3', s: 'u^3' }, { tex: 'u + 3', s: 'u + 3' }, { tex: '2u', s: '2u' },
  { tex: 'e^u', s: 'e^u' }, { tex: T`\sqrt u`, s: 'sqrt(u)' }, { tex: T`\sin u`, s: 'sin(u)' }, { tex: T`\ln u`, s: 'ln(u)' }, { tex: T`\frac1u`, s: '1/u' }];
const INNER = [{ tex: 'u^2', s: 'u^2' }, { tex: 'u^3', s: 'u^3' }, { tex: 'u + 2', s: 'u + 2' }, { tex: '3u', s: '3u' },
  { tex: 'e^u', s: 'e^u' }, { tex: T`\sqrt u`, s: 'sqrt(u)' }, { tex: T`\frac1u`, s: '1/u' }];

const fact = n => n <= 1 ? 1 : n * fact(n - 1);

  let i = 0;
  const binary = (next, ops) => { let l = next(); while (ops.includes(toks[i])) { const op = toks[i++]; l = bin(op, l, next()); } return l; };
  const atom = () => {
    const t = toks[i++];
    if (t === '¬') return neg(atom());
    if (t === '(') { const f = top(); if (toks[i++] !== ')') throw 0; return f; }
    if (/^[PQRS][₀-₉\d]*$/.test(t)) return t;
    throw 0;
  };
  const mid = () => binary(atom, ['∧', '∨']), top = () => binary(mid, ['→', '↔']);
  const f = top();
  if (i !== toks.length) throw 0;
  return f;
}
function checkLogic(q, input) {
  const f = parseLogic(input), g = q._ref || (q._ref = parseLogic(q.a));
  if (q.nnf && !negOnLetters(f)) return false;
  return valid([f], g) && valid([g], f);
}

function check(q, input) {
  if (!input.trim()) return false;
  try {
    if (q.kind === 'num' || q.kind === 'expr') return checkExpr(q, input);
    if (q.kind === 'vec' || q.kind === 'mat') return checkGrid(q, input);
    if (q.kind === 'interval') return normSet(input) === normSet(q.a);
    if (q.kind === 'text') return [].concat(q.a).some(a => normText(a) === normText(input));
    if (q.kind === 'logic') return checkLogic(q, input);
    if (q.kind === 'syntax') return normLogic(input) === normLogic(q.a);
  } catch (e) { /* incomplete input */ }
  return false;
}

<script>

  expr: { mode: 'text', keys: ['^', '*', '/', '(', ')', 'x', 'pi', 'e', 'sin(', 'cos(', 'ln(', 'sqrt('] },
  vec: { mode: 'decimal', keys: ['-', ',', '/'] },

}

  const types = activeTypes(), cats = [...new Set(types.map(t => t.cat))];

function renderMath(str) {

}

  }
  for (const [s, op] of SYNTAX_CASES.main) fail('main connective', s, op, parseLogic(s).op);
  return { cases: Object.values(SYNTAX_CASES).flat().length, failed };
}

function checkerTests() {
  const failed = [];
  let passed = 0;
  const run = (q, inputs, want) => inputs.forEach(s => {
    const got = check({ ...q }, s);
    if (got === want) passed++; else failed.push({ canonical: q.a, kind: q.kind, input: s, expected: want, got });
  });
  for (const [a, kind, yes, no, opt] of CHECKER_CASES) { run({ a, kind, ...opt }, yes, true); run({ a, kind, ...opt }, no, false); }
  for (const [q, yes, no] of GRID_CASES) { run(q, yes, true); run(q, no, false); }
  return { passed, failed };
}

const answerInput = q => q.kind === 'vec' ? q.a.join(',') : q.kind === 'mat' ? q.a.map(r => r.join(',')).join(';') : [].concat(q.a)[0];
function generatorTests() {
  return TYPES.map(t => {
    const errors = [], seen = new Set();
    let bools = 0, made = 0, nulls = 0;
    for (let i = 0; i < 300 && errors.length < 3; i++) {
      let q;
      try { q = t.gen(); } catch (e) { errors.push('throws: ' + e.message); continue; }
      if (!q) { nulls++; continue; }
      made++;
      seen.add(q.q);
      errors.push(...validateQuestion(q));
      if (q.kind === 'bool') bools += q.a ? 1 : 0;
    }
    if (made < 30) errors.push(`only ${made}/300 draws accepted`);
    const res = { id: t.id, week: t.week, distinct: seen.size, errors };
    if (made && TYPES.length && bools) res.trueRatio = +(bools / made).toFixed(2);
    return res;
  });
}
function validateQuestion(q) {
  const errs = [];
  try { katex.renderToString(q.q.split('$').filter((_, i) => i % 2).join(' '), { throwOnError: true }); }
  catch (e) { errs.push(`KaTeX: ${e.message} in ${q.q}`); }
  if (q.show !== undefined) {
    try { katex.renderToString(q.show, { throwOnError: true }); } catch (e) { errs.push(`KaTeX show: ${q.show}`); }
  }
  if (q.kind === 'bool') { if (typeof q.a !== 'boolean' || q.labels?.length !== 2) errs.push('bad bool ' + q.q); return errs; }
  if (!check({ ...q }, answerInput(q))) errs.push(`own answer rejected: ${JSON.stringify(q.a)} for ${q.q}`);
  if (q.val !== undefined) {
    const v = evalAt(compileExpr(q.a), {});
    if (!v || !near(v, { re: q.val, im: 0 }, 1e-6)) errs.push(`value mismatch: ${q.a} vs ${q.val} for ${q.q}`);
  }
  if (q.check === false) errs.push('internal check failed ' + q.q);
  return errs;
}

if (location.hash === '#test') runSelfTest(); else init();
